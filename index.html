  "body": {
   "en": "<h4>Can I visit more than one location in a turn?</h4><p>No. Move = Travel → Avoid → Visit, and you visit only the location where you end. Subway and Heliport are used while travelling (not visits); you can't pass through other locations. To visit again you need your next turn or an Extra Action disc (Night/Dawn).</p>\n<h4>Can I use a gang biker after visiting to fly somewhere else?</h4><p>No. The biker flight only works during the Travel step. After the Visit your action is over. Components with footprints = Travel only; shield = Avoid only; no symbol = any time (but none of them moves you to another location).</p>\n<h4>Can I stay where I am, or stop on a street?</h4><p>No. You must end on a different location, never on land or water. The only way not to move is to Rest.</p>\n<h4>Does a Gas Can give me another turn?</h4><p>No — it gives +1 MP in the same journey. The game uses it automatically when a destination needs it.</p>\n<h4>Can I revisit Businesses and Safe Houses?</h4><p>No: each player visits each one only once in the game. Other players can still visit them (Businesses close after 2 or 3 visits in total).</p>\n<h4>And the other locations? Exits (open or closed)?</h4><p>No limit. Stores, Hospital, Clinic, Church and Exits can be visited again — at a closed exit you can take another exit tile on a later turn. A Gang HQ only if nobody is there and nobody (including you) controls it.</p>\n<h4>Can I open the same locker twice (e.g. green twice)?</h4><p>Yes, if you have another key of that colour (or the Master Key), on a different visit — one locker per visit. The tile you kept is no longer in the pile.</p>\n<h4>Do I pay to use a Fixer?</h4><p>No. You pay its price only when you buy it at a Safe House.</p>\n<h4>My item spaces are full and I get a new tile. What happens?</h4><p>You choose which tile to replace (it goes to the box) and gain 1 notoriety. The game asks you.</p>\n<h4>Can I cross water?</h4><p>Only if that body of water has an F (ferry) on any of its tiles — the ferry serves all connected water — or with a Jet Ski.</p>\n<h4>When are two tiles connected?</h4><p>Where the same land colour really touches along the shared edge (even a short stretch). Locations that reach the tile edge also touch what is across it.</p>\n<h4>The Heliport flies me to a land space — but I can't end on land?</h4><p>The flight can land <b>directly on a location</b> 1–2 tiles away — that is the usual use. Starting from a location: leave to the street (1 MP), enter the Heliport (1 MP), fly straight into the location you want (1 MP) = 3 MP. If you ended your previous turn on the Heliport, the flight costs only 1 MP and you still have 2 left. Landing on a land space only makes sense if you still have MP to enter a location (gas, subway). The game shows only destinations you can really reach; the route steps say “flight”.</p>\n<h4>How do I keep a game or continue it on another device?</h4><p>Connect <b>Google Drive</b> in the main menu: the game then saves on this device and on Drive (offline it waits and sends it when the connection is back), and “Continue” on any device opens the newest game. Without Drive, the game is kept on this device (as long as the browser doesn’t clear site data when it closes).</p>\n<h4>Does a gang biker avoid all the police on a tile?</h4><p>Yes. In the Avoid step a biker (or the Motorcycle fixer, Fast Car card, avoid-tile asset) ignores every officer on one tile. In the avoid window these appear on the “Whole tile” line; equipment and cards like Stunt avoid one officer at a time.</p>\n<h4>I gained 2 and lost 2 notoriety. Then gained 1 more?</h4><p>2 red + 2 blue = no change. With all 4 cubes used, the next gain takes a blue cube back: net +1. Your box \"Notoriety this round\" shows it.</p>",
   "pt": "<h4>Posso visitar mais do que um local no mesmo turno?</h4><p>Não. Mover = Viajar → Evitar → Visitar, e só visitas o local onde acabas. O Metro e o Heliporto usam-se durante a viagem (não são visitas); não podes passar por outros locais. Para visitar outro precisas do próximo turno ou de um disco de Ação Extra (Noite/Madrugada).</p>\n<h4>Posso usar o motard do gang depois de visitar, para voar para outro sítio?</h4><p>Não. O voo do motard só funciona no passo Viajar. Depois da Visita a ação acabou. Peças com pegadas = só a Viajar; escudo = só a Evitar; sem símbolo = a qualquer momento (mas nenhuma te leva a outro local).</p>\n<h4>Posso ficar onde estou, ou parar na rua?</h4><p>Não. Tens de acabar noutro local, nunca em terreno ou água. A única forma de não te mexeres é Descansar.</p>\n<h4>A lata de gasolina dá-me outra jogada?</h4><p>Não — dá +1 MP na mesma viagem. O jogo usa-a sozinho quando um destino precisa dela.</p>\n<h4>Posso revisitar Businesses e Casas Seguras?</h4><p>Não: cada jogador visita cada um só uma vez no jogo. Os outros jogadores continuam a poder visitá-los (os Businesses fecham ao fim de 2 ou 3 visitas no total).</p>\n<h4>E os outros locais? Saídas (abertas ou fechadas)?</h4><p>Sem limite. Lojas, Hospital, Clínica, Igreja e Saídas podem ser revisitados — numa saída fechada podes tirar outra peça de saída noutro turno. Uma Sede de Gang só se não estiver lá ninguém e ninguém (incluindo tu) a controlar.</p>\n<h4>Posso abrir o mesmo cacifo duas vezes (ex.: o verde)?</h4><p>Sim, se tiveres outra chave dessa cor (ou a Chave Mestra), noutra visita — um cacifo por visita. A peça que guardaste já não está na pilha.</p>\n<h4>Pago para usar um Fixer?</h4><p>Não. Pagas o preço só quando o compras numa Casa Segura.</p>\n<h4>Tenho os espaços de item cheios e recebo uma peça nova. O que acontece?</h4><p>Escolhes que peça substituir (vai para a caixa) e ganhas 1 de notoriedade. O jogo pergunta-te.</p>\n<h4>Posso atravessar água?</h4><p>Só se essa massa de água tiver um F (ferry) em qualquer das suas peças — o ferry serve toda a água ligada — ou com um Jet Ski.</p>\n<h4>Quando é que duas peças estão ligadas?</h4><p>Onde a mesma cor de terreno se toca mesmo ao longo da margem comum (basta um troço pequeno). Locais que chegam à margem também tocam no que está do outro lado.</p>\n<h4>O Heliporto leva-me a um terreno — mas não posso acabar num terreno?</h4><p>O voo pode aterrar <b>diretamente num local</b> a 1–2 peças — é o uso normal. Partindo de um local: sair para a rua (1 MP), entrar no Heliporto (1 MP), voar diretamente para o local que queres (1 MP) = 3 MP. Se acabaste o turno anterior no Heliporto, o voo custa só 1 MP e ainda te sobram 2. Aterrar num terreno só serve se ainda tiveres MP para entrar num local (gasolina, metro). O jogo só mostra destinos a que consegues mesmo chegar; os passos do caminho dizem “voo”.</p>\n<h4>Como guardo um jogo ou o continuo noutro dispositivo?</h4><p>Liga o <b>Google Drive</b> no menu principal: o jogo passa a guardar neste dispositivo e no Drive (sem internet fica à espera e envia quando a ligação voltar), e o “Continuar” em qualquer dispositivo abre o jogo mais recente. Sem Drive, o jogo fica guardado neste dispositivo (desde que o navegador não apague os dados dos sites ao fechar).</p>\n<h4>O motard do gang evita toda a polícia de uma peça?</h4><p>Sim. No passo Evitar, um motard (ou o fixer Mota, a carta Fast Car, o ativo de evitar uma peça) ignora todos os polícias de uma peça. Na janela de evitar aparecem na linha “Toda a peça”; o equipamento e cartas como Stunt evitam um polícia de cada vez.</p>\n<h4>Ganhei 2 e perdi 2 de notoriedade. E se ganhar mais 1?</h4><p>2 vermelhos + 2 azuis = fica igual. Com os 4 cubos usados, o ganho seguinte devolve um azul: +1 no total. A caixa \"Notoriedade desta ronda\" mostra isto.</p>"
  }
 }

};
