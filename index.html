:root{
  --bg:#121419;--bg2:#1a1e26;--bg3:#232834;--line:#2e3442;--paper:#f1e7d0;--paper2:#e4d6b6;--paper3:#d6c49c;--ink:#1d1b18;--ink2:#5a5246;
  --red:#d23b33;--red2:#a82820;--mustard:#e8b546;--teal:#36a99c;--muted:#8d93a0;--text:#e9e6df;
  --I:#3b3f47;--C:#cdbf9d;--R:#5ea54a;--W:#2f72c6;
  --orange:#f08a24;--purple:#9050c8;--pink:#e85d9e;--yellow:#f2c629;--green:#3eae50;
  --county:#3d9be0;--federal:#d23b33;--swat:#202226;
  --ff-type:'Special Elite','Courier New',monospace;--ff-ui:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--ff-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --speed:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ff-body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:var(--ff-ui);font-size:15px;letter-spacing:.3px;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--bg3);color:var(--text);transition:transform .12s, background .15s, box-shadow .15s}
button:hover{background:#2c3342}button:active{transform:scale(.96)}button:disabled{opacity:.4;cursor:default;transform:none}
button.pri{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red2)}button.pri:hover{background:#e04a41}
button.gold{background:var(--mustard);color:#2a1f05;box-shadow:0 3px 0 #b8862a}
button.ghost{background:transparent;border:1px solid var(--line)}
.ic{width:1.2em;height:1.2em;vertical-align:-.22em;flex:none}
.hidden{display:none!important}
/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 70% 10%,#2a2131 0,transparent 60%),radial-gradient(900px 600px at 10% 90%,#162a2f 0,transparent 60%),var(--bg);overflow:auto;padding:24px 16px}
.logo{font-family:var(--ff-type);font-size:clamp(64px,13vw,150px);letter-spacing:.06em;color:var(--paper);text-shadow:0 0 0 #000,4px 4px 0 var(--red);line-height:1;transform:rotate(-2deg)}
.logo span{display:inline-block;animation:flick 4s infinite}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.4}96%{opacity:1}97%{opacity:.6}}
.tag{font-family:var(--ff-ui);text-transform:uppercase;letter-spacing:.35em;color:var(--mustard);margin:10px 0 34px;text-align:center}
.menu-btns{display:flex;flex-direction:column;gap:12px;min-width:260px;width:min(440px,calc(100vw - 32px))}
.menu-btns button{font-size:20px;padding:13px}
.tape{position:absolute;background:var(--mustard);color:#1d1b18;font-family:var(--ff-ui);font-weight:700;letter-spacing:.3em;padding:6px 60px;white-space:nowrap;opacity:.9}
.lang-switch{display:flex;gap:6px;margin-top:22px}.lang-switch button{padding:6px 12px}.lang-switch button.on{background:var(--paper);color:var(--ink)}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 10px 30px #0008,inset 0 0 40px #c9b48a55;background-image:repeating-linear-gradient(0deg,transparent 0 27px,#0000000a 27px 28px)}
.setup{width:min(720px,100%);padding:22px 24px 26px;position:relative}
.setup h2{font-family:var(--ff-type);font-size:28px;margin:0 0 4px}
.setup .hint{color:var(--ink2);font-size:14px;margin-bottom:14px}
.seat{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed #0002}
.seat .sw{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 -3px 0 #0003}
.seat .nm{font-family:var(--ff-ui);font-size:18px;flex:1}
.seg{display:flex;background:#0000000f;border-radius:8px;padding:3px;gap:2px}
.seg button{background:transparent;color:var(--ink);padding:6px 11px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--paper)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:14px 0}
.opt label{display:block;font-family:var(--ff-ui);font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);margin-bottom:4px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--red)}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
/* ---------- game layout ---------- */
#game{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);grid-template-rows:50px 1fr auto;grid-template-areas:"top top" "map side" "bar side"}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 8px;min-width:0;overflow:hidden;background:linear-gradient(#1c2029,#161920);border-bottom:1px solid var(--line);z-index:5}
#top .daybox{font-family:var(--ff-type);font-size:20px;color:var(--paper);white-space:nowrap}
.timeline{display:flex;gap:4px;align-items:center}
.tl{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);color:var(--muted);font-size:11px;position:relative;transition:all .3s}
.tl.on{background:var(--mustard);color:#221a05;transform:scale(1.15);box-shadow:0 0 0 3px #e8b54633}
.tl.past{opacity:.45}.tl.opt{border:1px dashed #fff3}
.exits{display:flex;gap:6px;margin-left:auto}
.exitb{display:flex;align-items:center;gap:4px;white-space:nowrap;padding:4px 8px;border-radius:6px;background:#f6d64a;color:#2a2205;font-family:var(--ff-type);font-size:14px;box-shadow:0 2px 0 #b89d2a;transform:rotate(-1.5deg)}
.exitb .pc{display:flex;gap:2px}.exitb .pc i{width:8px;height:12px;border-radius:2px;background:#0003}.exitb .pc i.on{background:var(--red)}
.exitb.closed{background:#7a7a7a;color:#eee;box-shadow:0 2px 0 #555;text-decoration:line-through}
.exitb.last{outline:2px solid #fff;animation:pulse 1.4s infinite}
.tbtn{padding:7px 9px;background:transparent;border:1px solid var(--line)}
#mapwrap{grid-area:map;position:relative;overflow:hidden;background:radial-gradient(900px 600px at 50% 40%,#1e2430,#111318)}
#map{width:100%;height:100%;display:block;touch-action:none}
#side{grid-area:side;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:4}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border-radius:0;background:transparent;padding:11px 4px;color:var(--muted);font-size:15px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--red)}
.panel{flex:1;overflow:auto;padding:10px;min-height:0}
#bar{grid-area:bar;background:linear-gradient(#171a21,#12141a);border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px;z-index:6}
#ticker{font-size:13px;color:var(--muted);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker b{color:var(--text);font-weight:500}
#prompt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#prompt .msg{font-family:var(--ff-ui);font-size:17px;flex:1 1 220px;min-width:180px}
#prompt .msg small{display:block;color:var(--muted);font-family:var(--ff-body);font-size:13px}
.who{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px #0005}
@media (max-width:900px),(max-height:520px){
  #game{grid-template-columns:minmax(0,1fr);grid-template-rows:46px minmax(0,1fr) auto;grid-template-areas:"top" "map" "bar"}
  #side{position:fixed;right:0;top:46px;bottom:0;width:min(380px,92vw);transform:translateX(105%);transition:transform .25s;box-shadow:-10px 0 30px #0008}
  #side.open{transform:none}
  #top .daybox{font-size:16px}.tl{width:22px;height:22px}
  .exitb{font-size:12px;padding:3px 6px}
}
@media (min-width:901px) and (min-height:521px){#sideToggle{display:none}}
@media (max-width:620px){.exitb .xl{display:none}.timeline .tl:not(.on){display:none}#top .daybox.ph{display:none}.exitb{font-size:11px;padding:2px 5px;gap:2px}.exitb .pc i{width:5px;height:9px}#bSpeed span,.tbtn .lbl{display:none}#top{gap:6px}.tbtn{padding:6px 7px}}
@media (max-height:520px){#bar{padding:4px 8px;gap:3px}#prompt .msg{font-size:15px}#prompt .msg small{display:none}#ticker{display:none}#sheet{max-height:78%}}
/* ---------- map ---------- */
.cell-slot{fill:#ffffff06;stroke:#ffffff1c;stroke-width:2;stroke-dasharray:6 6}
.cell-slot.start{fill:#ffffff0d}
.cell-slot.legal{fill:#e8b54622;stroke:var(--mustard);stroke-dasharray:none;animation:glow 1.2s infinite alternate;cursor:pointer}
@keyframes glow{from{fill-opacity:.15}to{fill-opacity:.55}}
.tile-edge{fill:none;stroke:#0b0d10;stroke-width:3}
.loc{cursor:default}
.loc .ring{transition:all .2s}
.loc.dest{cursor:pointer}
.loc.dest .halo{fill:none;stroke:#fff;stroke-width:5;animation:halo 1.1s infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{stroke-opacity:.95;transform:scale(1)}100%{stroke-opacity:0;transform:scale(1.6)}}
.loc.dest.esc .halo{stroke:var(--mustard)}
.loc.sel .ring{stroke:var(--mustard)!important;stroke-width:6!important}
.loc .badge{font-family:var(--ff-ui);font-weight:700}
.closedX{opacity:.85}
.path-prev{fill:none;stroke:var(--mustard);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 12;animation:dash 0.6s linear infinite;filter:drop-shadow(0 0 4px #000)}
@keyframes dash{to{stroke-dashoffset:-14}}
.copin.pick{cursor:pointer;animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.pawn{filter:drop-shadow(0 3px 2px #0009)}
.cell-dest{fill:#e8b54633;stroke:var(--mustard);stroke-width:4;cursor:pointer;animation:glow 1s infinite alternate}
/* ---------- side panels ---------- */
.pcard{background:var(--bg3);border-radius:10px;padding:10px;margin-bottom:10px;position:relative;border-left:5px solid var(--c,#888)}
.pcard.cur{box-shadow:0 0 0 2px var(--c,#888)}
.pcard h3{margin:0;font-family:var(--ff-ui);font-size:19px;display:flex;align-items:center;gap:8px}
.expi{color:var(--muted);font-size:14px;width:12px}
.exphint{font-size:12px;color:var(--muted);margin-top:6px;cursor:pointer;text-decoration:underline dotted}
.pcard h3 .tagx{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.stats{display:flex;gap:10px;margin:8px 0;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:4px;background:#0003;border-radius:6px;padding:4px 8px;font-family:var(--ff-ui);font-size:17px}

/* ---------- sheets / modals ---------- */
#sheet{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(680px,calc(100% - 16px));max-height:60%;overflow:auto;padding:14px 16px;z-index:8;animation:sheetin .25s}
@keyframes sheetin{from{transform:translate(-50%,30px);opacity:0}}
#sheet h3{margin:0 0 4px;font-family:var(--ff-type);font-size:21px}
#sheet .sub{color:var(--ink2);font-size:14px;margin-bottom:10px}
#sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
#sheet button{background:var(--ink);color:var(--paper)}
#sheet button.pri{background:var(--red);color:#fff}
#sheet button.ghost{background:transparent;color:var(--ink);border:1px solid #0003}
.choice{display:flex;align-items:center;gap:8px;background:#fff8;border:1px solid #0002;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);text-align:left;font-family:var(--ff-body);font-size:14px}
.choice:hover{background:#fff}
.choice .ic{width:24px;height:24px}
.choice .ccard .ic,.choice .etile .ic{width:auto;height:auto}.choice .ltile{min-height:0}
.choice b{font-family:var(--ff-ui);font-size:16px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.choice.wide{grid-column:span 2;gap:14px}.choices:has(.lockopt){grid-template-columns:90px repeat(3,minmax(0,1fr))}.choice.lockopt{flex-direction:column;align-items:center;gap:6px;text-align:center}.choice.lockopt .ltile{width:110px}@media (max-width:620px){.choices:has(.lockopt){grid-template-columns:repeat(2,minmax(0,1fr))}}.choice.lockopt .ltxt{font-size:13.5px}.choice.lockopt .big{font-size:17px}.choice.off{opacity:.45;cursor:not-allowed;filter:grayscale(.7)}.choice.narrow{justify-content:center}@media (max-width:620px){.choice.wide{grid-column:1/-1}}
.off-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #0002;flex-wrap:wrap}

.pop{position:absolute;z-index:9;min-width:230px;max-width:300px;padding:10px 12px}
.paper button.ghost{color:var(--ink);border:1px solid #0003}
.pop button.pri{background:var(--red);color:#fff}
.loclabel{cursor:pointer}.mpb{pointer-events:none}.mpb circle{fill:#f2c629;stroke:#1a1a1a;stroke-width:2.5}.mpb text{font:700 13px 'Barlow Condensed',sans-serif;text-anchor:middle;fill:#1a1a1a}
.abgrp{margin:6px 0 8px}.abh{font-family:var(--ff-ui);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#5a4a2a;margin-bottom:4px;display:flex;align-items:center;gap:5px}.abh .ic{width:15px;height:15px}
.overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}.npick{max-width:520px;width:100%;padding:16px 18px}.npick h3{margin:0 0 10px;font-family:var(--ff-type)}.npick .row{margin-top:12px}.npo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.npo .choice{flex-direction:column;align-items:flex-start;gap:4px;text-align:left}.npo .choice span{font-size:13.5px;opacity:.85}.soon{font-style:normal;font-size:11px;background:#f2c629;color:#1a1a1a;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:2px}

.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.menu-btns .mrow button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.menu-btns .mrow button small{font-size:11.5px;font-weight:400;opacity:.8}.menu-btns .mrow .ic{display:none}.msmall{text-align:center;font-size:12.5px;margin-top:4px}.msmall a{color:var(--muted)}
.savemode{margin-top:14px;text-align:center}.smt{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.smb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.smb button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:150px;padding:8px 12px;background:#20242c;border:2px solid #343a46;color:#e8e2d4;border-radius:10px;font-size:15px}.smb button small{font-size:11.5px;color:var(--muted)}.smb button.on{border-color:#f2c629;background:#2a2a1e}.smb .ic{width:20px;height:20px}.priv{display:inline-block;margin-top:6px;font-size:12px;color:var(--muted)}
.filebtns{display:flex;gap:8px;justify-content:center;margin-top:4px}.filebtns button{font-size:14px;padding:6px 12px}.filebtns .ic{width:16px;height:16px;vertical-align:-3px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2028;color:#fff;border:1px solid #f2c629;border-radius:8px;padding:8px 14px;z-index:99;font-size:14px}
.avtile{border:1px solid #0002;border-radius:8px;padding:4px 8px;margin:6px 0;background:#fff5}.avh{font-family:var(--ff-ui);font-weight:700;font-size:13px;color:#5a4a2a;margin-bottom:2px}.off-row.tilewide{background:#f2c62922;border-radius:6px}.opt-btn .ic{width:15px;height:15px;vertical-align:-3px}.opt-btn small{font-weight:400;opacity:.85}.noopt{color:#8a5a3a;font-size:13px}

/* ---------- effects ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.float{position:absolute;font-family:var(--ff-ui);font-weight:700;font-size:22px;text-shadow:0 2px 0 #000,0 0 8px #000;white-space:nowrap;animation:floatup calc(1.3s*var(--speed)) ease-out forwards}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--ff-type);font-size:clamp(34px,7vw,72px);color:var(--paper);text-shadow:3px 3px 0 var(--red),0 0 30px #000;animation:banner calc(1.4s*var(--speed)) ease-in-out forwards}
.banner small{display:block;font-family:var(--ff-ui);font-size:.32em;letter-spacing:.4em;color:var(--mustard);text-transform:uppercase;text-shadow:0 2px 0 #000}
@keyframes banner{0%{opacity:0;transform:translateX(-30%) skewX(-10deg)}18%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(30%) skewX(10deg)}}
.flycard{position:absolute;transition:all calc(.7s*var(--speed)) cubic-bezier(.5,-.2,.4,1.3)}
.flash{animation:flash calc(.9s*var(--speed))}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px var(--mustard),0 0 30px var(--mustard)}}
.flashred{animation:flashred calc(.9s*var(--speed))}
@keyframes flashred{0%,100%{background:inherit}30%{background:#7a1b16}}
@keyframes pulse{50%{transform:rotate(-1.5deg) scale(1.08)}}
.stamp{position:absolute;font-family:var(--ff-type);font-size:64px;color:var(--red);border:6px solid var(--red);padding:4px 20px;border-radius:10px;transform:rotate(-12deg);animation:stamp calc(1.3s*var(--speed)) forwards;background:#0006}
@keyframes stamp{0%{transform:rotate(-12deg) scale(3);opacity:0}20%{transform:rotate(-12deg) scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
/* rules */
#rules{position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px}
#rules .box{width:min(900px,100%);height:min(720px,100%);display:grid;grid-template-columns:240px 1fr;overflow:hidden;padding:0}
#rules nav{background:#00000010;border-right:1px solid #0002;overflow:auto;padding:10px}
#rules nav input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #0003;font-size:15px;margin-bottom:8px;background:#fff}
#rules nav button{display:flex;gap:6px;width:100%;text-align:left;background:transparent;color:var(--ink);padding:7px 8px;font-size:15px}
#rules nav button.on{background:var(--ink);color:var(--paper)}
#rules article{overflow:auto;padding:16px 22px;font-size:15.5px;line-height:1.5}
#rules article h4{margin:14px 0 4px;font-family:var(--ff-type);font-size:17px}#rules article .ex{background:#fff7d6;border-left:4px solid var(--mustard);border-radius:6px;padding:8px 12px;margin:10px 0;font-size:14.5px}#rules article .ex>b:first-child{display:block;font-family:var(--ff-type);font-size:14px;color:#8a6a10;margin-bottom:2px}#rules article .ex p{margin:4px 0}#rules article .note{background:#e8eef7;border-left:4px solid #6f8fbf;border-radius:6px;padding:7px 12px;margin:10px 0;font-size:14px}#rules article table.rt{border-collapse:collapse;margin:8px 0;font-size:14px}#rules article table.rt th,#rules article table.rt td{border:1px solid #0002;padding:3px 9px;text-align:center}#rules article table.rt th{background:#0000000d}#rules article table.rt td:first-child{text-align:left;font-weight:600}
#rules article h2{font-family:var(--ff-type);margin:0 0 8px;font-size:26px}
#rules article .lt{padding:1px 7px;border-radius:4px;color:#fff;font-size:13px}.lt.I{background:var(--I)}.lt.C{background:#a99668}.lt.R{background:var(--R)}.lt.W{background:var(--W)}
.pc.county{color:#2378c0}.pc.federal{color:var(--red)}.pc.swat{color:#111}
.grp.purple{color:#7a35b0;font-weight:600}.grp.blue{color:#2563b0;font-weight:600}
#rules .close{position:absolute;top:10px;right:12px}
#rules .res{border-bottom:1px dashed #0002;padding:8px 0;cursor:pointer}
#rules .res b{font-family:var(--ff-ui);font-size:17px}
@media (max-width:700px){#rules .box{grid-template-columns:1fr;grid-template-rows:auto 1fr}#rules nav{max-height:180px}}
/* end */
.scoretbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.scoretbl th,.scoretbl td{padding:5px 6px;border-bottom:1px solid #0001;text-align:right}
.scoretbl th:first-child,.scoretbl td:first-child{text-align:left}
.scoretbl tr.tot td{font-weight:700;font-size:16px;border-top:2px solid var(--ink)}
.scoretbl .win{background:#f6d64a66}
.hextile{display:inline-block;cursor:pointer;border-radius:8px;padding:3px;transition:transform .15s}
.hextile:hover{transform:translateY(-3px)}.hextile.sel{background:var(--mustard)}
</style>
</head>

  "body": {
   "en": "<p>In the City phase each player in turn order places one of the face-up tiles, until all 4 are placed (with fewer than 4 players the order starts again; with 5, the last player doesn't place one). A new tile must:</p><ul><li>touch <b>at least 2</b> tiles already in the city, and</li><li>be rotated so that <b>at least one</b> land type continues into the same land type of a neighbouring tile (touching only at a corner doesn't count).</li></ul><p>When you place it: its police officers move with it; if it has a <b>Business</b> or <b>Safe House</b> space you choose which Business / Safe House tile goes there; a Gang space gets 2 gang members.</p><p>The 4 new tiles revealed afterwards each get 2 police from the bag; if both are the same type, one goes back. A tile never has two officers of the same type, and the <b>Hospital tile never has police</b>.</p><div class=\"ex\"><b>Example</b><p>Dynamo, Wheels and Tumbler play in that order. Dynamo places the 1st tile, Wheels the 2nd, Tumbler the 3rd, and then Dynamo again places the 4th.</p></div><div class=\"note\">Tip: joining several land types makes moving around the city easier — for you and for everyone else. In the game, tap a tile in the display, then a highlighted space; use the rotate button to see every legal rotation.</div>",
   "pt": "<p>Na fase da Cidade, cada jogador por ordem de turno coloca uma das peças viradas para cima, até as 4 estarem colocadas (com menos de 4 jogadores a ordem recomeça; com 5, o último não coloca nenhuma). Uma peça nova tem de:</p><ul><li>tocar em <b>pelo menos 2</b> peças que já estão na cidade, e</li><li>ficar rodada de forma a que <b>pelo menos um</b> tipo de terreno continue no mesmo terreno de uma peça vizinha (tocar só num canto não conta).</li></ul><p>Ao colocá-la: os polícias que lá estão vão com ela; se tiver um espaço de <b>Business</b> ou de <b>Casa Segura</b>, escolhes qual Business / Casa Segura lá fica; um espaço de Gang recebe 2 motards.</p><p>As 4 peças reveladas a seguir recebem 2 polícias do saco cada uma; se forem do mesmo tipo, um volta para o saco. Uma peça nunca tem dois polícias do mesmo tipo, e a <b>peça do Hospital nunca tem polícia</b>.</p><div class=\"ex\"><b>Exemplo</b><p>O Dynamo, a Wheels e a Tumbler jogam por esta ordem. O Dynamo coloca a 1.ª peça, a Wheels a 2.ª, a Tumbler a 3.ª, e depois o Dynamo volta a colocar a 4.ª.</p></div><div class=\"note\">Dica: ligar vários tipos de terreno facilita o movimento na cidade — para ti e para os outros. No jogo, toca numa peça da mostra e depois num espaço destacado; usa o botão de rodar para ver todas as rotações possíveis.</div>"
  }
 },
 {
  "id": "actions",
  "icon": "🎬",
  "kw": "action move rest travel avoid visit ação mover descansar viajar evitar visitar stay ficar parar terreno land",
  "title": {
   "en": "Your action: Move or Rest",
   "pt": "A tua ação: Mover ou Descansar"
  },
  "body": {
   "en": "<p>On your turn you take <b>one action</b>: <b>Move</b> or <b>Rest</b>. You can't pass.</p><h4>Move</h4><ol><li><b>Travel</b>: spend up to 3 movement points (MP) to go from your location to a <b>different location</b>. You must end on a location — <b>never on a land space</b> (street or water) — and never on the one you started from. Gas, the subway and some cards give extra MP.</li><li><b>Avoid</b>: avoid the police on every tile you <b>left</b> (the starting tile and any tile you passed through, not the tile where you stop). Each officer you can't avoid is a wound.</li><li><b>Visit</b>: do what the location says, step by step (steps with \"may\" are optional). Subway and Heliport have no visit.</li></ol><h4>Rest</h4><p>Only if your rest token shows the <b>sun</b> (so once per day, 3 times per game). Flip it to the moon, flip back all your used Contact cards, Equipment and First Aid, and unlock 1 asset. <b>You stay where you are</b> — this is the only way not to move.</p><p>In both cases you can also use any number of <b>executive actions</b> (cards, equipment, fixers, assets, gang members, first aid).</p><div class=\"ex\"><b>Example</b><p>You're at the Bar and want to stay to wait for a better moment. You can't just stay on the street next to it: either you move to another location, or you Rest (if your token still shows the sun) and stay at the Bar.</p></div>",
   "pt": "<p>No teu turno fazes <b>uma ação</b>: <b>Mover</b> ou <b>Descansar</b>. Não podes passar.</p><h4>Mover</h4><ol><li><b>Viajar</b>: gastas até 3 pontos de movimento (MP) para ir do teu local para <b>outro local</b>. Tens de acabar num local — <b>nunca num terreno</b> (rua ou água) — e nunca naquele de onde partiste. A gasolina, o metro e algumas cartas dão MP extra.</li><li><b>Evitar</b>: evitas a polícia de todas as peças que <b>deixaste</b> (a peça de partida e as peças por onde passaste, não a peça onde paras). Cada polícia que não consegues evitar é um ferimento.</li><li><b>Visitar</b>: fazes o que o local indica, passo a passo (os passos com \"podes\" são opcionais). O Metro e o Heliporto não têm visita.</li></ol><h4>Descansar</h4><p>Só se o teu marcador de descanso mostrar o <b>sol</b> (ou seja, 1 vez por dia, 3 vezes por jogo). Vira-o para a lua, viras de volta todas as cartas de Contacto, equipamento e Primeiros Socorros usados, e desbloqueias 1 ativo. <b>Ficas onde estás</b> — é a única forma de não te mexeres.</p><p>Em ambos os casos podes também usar quantas <b>ações executivas</b> quiseres (cartas, equipamento, fixers, ativos, motards, primeiros socorros).</p><div class=\"ex\"><b>Exemplo</b><p>Estás no Bar e queres ficar à espera de um momento melhor. Não podes ficar na rua ao lado: ou te mudas para outro local, ou Descansas (se o marcador ainda mostrar o sol) e ficas no Bar.</p></div>"
  }
 },
 {
  "id": "movement",
  "icon": "👣",
  "kw": "movement mp land type industrial commercial residential water ferry subway metro heliport helipad gas cost movimento terreno água ferry gasolina",
  "title": {
   "en": "Movement",
   "pt": "Movimento"
  },
  "body": {
   "en": "<p>Each movement point (MP) pays for one of these:</p><ul><li><b>Leave</b> a location onto a land space next to it.</li><li><b>Enter</b> a location from a land space next to it.</li><li><b>Cross</b> from one land type to a different one.</li><li>Move from a location <b>straight to another location</b> touching it.</li></ul><p>Moving along the <b>same land type</b>, even across many tiles, is <b>free</b>. Land types: <span class=\"lt I\">Industrial</span> (black) <span class=\"lt C\">Commercial</span> (grey/beige) <span class=\"lt R\">Residential</span> (green) <span class=\"lt W\">Water</span> (blue). A location is next to every land space (or location) it touches along a side — corners don't count. Some locations (Business and Safe House spaces, Gang HQs) reach the <b>edge of the tile</b>: they also touch whatever is across that edge on the neighbouring tile. Two land spaces are connected only where their colours really touch along the shared edge — even a short stretch counts.</p><p><b>Water</b> can only be crossed if that <b>body of water</b> has a <b>ferry</b> (F icon) on <b>any</b> of its tiles — the ferry serves the whole connected water, even if you don't start or end on the F tile. A Jet Ski lets you use any body of water.</p><ul><li><b>Subway</b>: when you enter a subway you may jump straight to any other subway for free, and you get <b>+1 MP</b> that turn.</li><li><b>Heliport</b>: when you enter it (or start there), spend 1 MP to fly to any land space or location on a tile 1 or 2 tiles away.</li><li><b>Gas Cans</b>: return one to get +1 MP (max 2 cans).</li></ul><p>You may pass <b>through</b> Subway and Heliport, but not through any other location.</p><div class=\"ex\"><b>Example</b><p>Dynamo is at a Store. 1 MP to leave onto the Industrial area; he follows the connected Industrial areas across two tiles for free; 1 MP to cross into Residential; 1 MP to enter the Safe House. Total: 3 MP.</p></div><div class=\"ex\"><b>Example</b><p>Pixel is at a Business on the water of a tile with an F. 1 MP to leave onto the water; she crosses all the connected water for free; 1 MP to step onto Commercial; 1 MP to enter the Store. Total: 3 MP.</p></div><div class=\"ex\"><b>Example</b><p>Tumbler, at a Gang HQ: 1 MP to Industrial, 1 MP into the Subway, jumps to another Subway (free, +1 MP), then 1 MP to Residential and 1 MP into the Store. 4 MP in total, possible thanks to the subway.</p></div><div class=\"note\">In the game, tap a highlighted location: the route is drawn on the map, every MP is numbered, and the window lists what each MP is spent on (and whether a ferry is used).</div>",
   "pt": "<p>Cada ponto de movimento (MP) paga uma destas coisas:</p><ul><li><b>Sair</b> de um local para um terreno ao lado.</li><li><b>Entrar</b> num local a partir de um terreno ao lado.</li><li><b>Passar</b> de um tipo de terreno para outro diferente.</li><li>Ir de um local <b>diretamente para outro local</b> que lhe toca.</li></ul><p>Andar pelo <b>mesmo tipo de terreno</b>, mesmo atravessando muitas peças, é <b>grátis</b>. Terrenos: <span class=\"lt I\">Industrial</span> (preto) <span class=\"lt C\">Comercial</span> (cinzento/bege) <span class=\"lt R\">Residencial</span> (verde) <span class=\"lt W\">Água</span> (azul). Um local está ao lado de todos os terrenos (ou locais) em que toca por um lado — os cantos não contam. Alguns locais (espaços de Business e de Casa Segura, Sedes de Gang) chegam à <b>margem da peça</b>: tocam também no que estiver do outro lado dessa margem, na peça vizinha. Dois terrenos só estão ligados onde as cores se tocam mesmo ao longo da margem comum — basta um troço pequeno.</p><p>A <b>água</b> só se atravessa se essa <b>massa de água</b> tiver um <b>ferry</b> (ícone F) em <b>qualquer</b> das suas peças — o ferry serve toda a água ligada, mesmo que não partas nem chegues à peça com o F. Com um Jet Ski podes usar qualquer massa de água.</p><ul><li><b>Metro</b>: ao entrar num metro podes saltar de graça para qualquer outro metro, e ganhas <b>+1 MP</b> nesse turno.</li><li><b>Heliporto</b>: ao entrar (ou se começares lá), gastas 1 MP para voar para qualquer terreno ou local numa peça a 1 ou 2 peças de distância.</li><li><b>Latas de gasolina</b>: devolves uma para ganhar +1 MP (máximo 2 latas).</li></ul><p>Podes passar <b>através</b> do Metro e do Heliporto, mas não de outros locais.</p><div class=\"ex\"><b>Exemplo</b><p>O Dynamo está numa Loja. 1 MP para sair para a zona Industrial; segue pelas zonas Industriais ligadas através de duas peças, de graça; 1 MP para passar para Residencial; 1 MP para entrar na Casa Segura. Total: 3 MP.</p></div><div class=\"ex\"><b>Exemplo</b><p>A Pixel está num Business na água de uma peça com F. 1 MP para sair para a água; atravessa toda a água ligada de graça; 1 MP para passar para Comercial; 1 MP para entrar na Loja. Total: 3 MP.</p></div><div class=\"ex\"><b>Exemplo</b><p>A Tumbler, numa Sede de Gang: 1 MP para Industrial, 1 MP para entrar no Metro, salta para outro Metro (grátis, +1 MP), depois 1 MP para Residencial e 1 MP para entrar na Loja. 4 MP no total, possível graças ao metro.</p></div><div class=\"note\">No jogo, toca num local destacado: o caminho aparece no mapa, cada MP vem numerado e a janela diz em que se gasta cada MP (e se usa ferry).</div>"
  }
 },
 {
  "id": "police",
  "icon": "👮",
  "kw": "police officer avoid wound handcuffs county federal swat polícia evitar ferimento algemas",
  "title": {
   "en": "Police, wounds & handcuffs",
   "pt": "Polícia, ferimentos e algemas"
  },
  "body": {
   "en": "<p>There are 3 kinds of officers: <b class=\"pc county\">County</b> (blue), <b class=\"pc federal\">Federal</b> (red) and <b class=\"pc swat\">SWAT</b> (black). A tile never has two of the same kind, and the Hospital tile has none.</p><p><b>When do you avoid?</b> After travelling, if you ended on a <b>different tile</b>, you must avoid every officer on each tile you <b>left</b>: the tile you started on and every tile you walked through — but <b>not</b> the tile where you stop. Moving between two locations on the same tile needs no avoiding. With the Subway or a flight you skip the tiles in between (you still avoid the tile you took off from).</p><p><b>How?</b> With executive actions: <b>Equipment</b> (Hat = County, Vest = Federal, Helmet = SWAT, Gas Mask = SWAT or County), Contact cards (Fighter, Boxer, Ninja, Stunt, Fast Car…), Fixers, assets or a gang biker (ignore one tile).</p><p><b>Wounds</b>: each officer you don't avoid moves one wound cube from green to red (−$20k each at the end). If all 3 are already red, the next wound gives you a <b>Handcuffs</b> card: it blocks your rightmost Contact space without handcuffs (an asset there is lost; a card there is covered), and one cube goes back to green. Several wounds are resolved one at a time.</p><div class=\"ex\"><b>Example</b><p>Dynamo goes from a Safe House, through the next tile, to a Store on a third tile. He must avoid the Federal officer on his starting tile and the Federal and County officers on the tile he walked through — but not the officers on the Store's tile.</p></div><div class=\"ex\"><b>Example</b><p>Tumbler already has 3 red wound cubes and fails to avoid 3 officers. 1st wound: Handcuffs card and one cube back to green. 2nd wound: that cube goes red again. 3rd wound: a second Handcuffs card and one cube back to green.</p></div>",
   "pt": "<p>Há 3 tipos de polícia: <b class=\"pc county\">County</b> (azul), <b class=\"pc federal\">Federal</b> (vermelho) e <b class=\"pc swat\">SWAT</b> (preto). Uma peça nunca tem dois do mesmo tipo, e a peça do Hospital não tem nenhum.</p><p><b>Quando é que evitas?</b> Depois de viajar, se acabaste numa <b>peça diferente</b>, tens de evitar todos os polícias de cada peça que <b>deixaste</b>: a peça de onde partiste e todas as peças por onde passaste — mas <b>não</b> a peça onde paras. Mudar entre dois locais da mesma peça não obriga a evitar. Com o Metro ou um voo saltas as peças pelo meio (mas evitas sempre a peça de onde partiste).</p><p><b>Como?</b> Com ações executivas: <b>equipamento</b> (Boné = County, Colete = Federal, Capacete = SWAT, Máscara de gás = SWAT ou County), cartas de Contacto (Fighter, Boxer, Ninja, Stunt, Fast Car…), Fixers, ativos ou um motard do gang (ignorar uma peça).</p><p><b>Ferimentos</b>: cada polícia que não evitas passa um cubo de ferimento do verde para o vermelho (−$20k cada no fim). Se os 3 já estiverem no vermelho, o ferimento seguinte dá-te uma carta de <b>Algemas</b>: bloqueia o teu espaço de Contacto mais à direita ainda sem algemas (um ativo que lá esteja perde-se; uma carta fica tapada), e um cubo volta ao verde. Vários ferimentos resolvem-se um a um.</p><div class=\"ex\"><b>Exemplo</b><p>O Dynamo vai de uma Casa Segura, passando pela peça seguinte, até uma Loja numa terceira peça. Tem de evitar o Federal da peça de partida e o Federal e o County da peça por onde passou — mas não os polícias da peça da Loja.</p></div><div class=\"ex\"><b>Exemplo</b><p>A Tumbler já tem os 3 cubos de ferimento no vermelho e não consegue evitar 3 polícias. 1.º ferimento: carta de Algemas e um cubo volta ao verde. 2.º: esse cubo volta ao vermelho. 3.º: segunda carta de Algemas e um cubo volta ao verde.</p></div>"
  }
 },
 {
  "id": "notoriety",
  "icon": "⭐",
  "kw": "notoriety cubes threshold line unlock police move penalty notoriedade cubos linha limiar penalização red blue vermelho azul",
  "title": {
   "en": "Notoriety",
   "pt": "Notoriedade"
  },
  "body": {
   "en": "<h4>During your turn: the 4 cubes</h4><p>Your marker doesn't move straight away. Each <b>gain</b> moves one of your 4 notoriety cubes from the middle to the <b>red box</b>; each <b>loss</b> moves one to the <b>blue box</b>. If the middle is empty: a gain takes a cube back from the blue box, a loss takes one back from the red box; if that box is empty too, nothing happens. So in one part of the day you never go beyond +4 or −4.</p><h4>After everyone has acted: adjust</h4><p>In turn order, each marker moves up 1 per red cube and down 1 per blue cube (work out the net result first), and the cubes go back to the middle. The marker can't go below the bottom; for each step above the top you take a <b>wound</b>.</p><h4>Gains and losses</h4><p><b>Gain</b>: visiting a location where other players are (+1 each; not at the Hospital), the Hospital (+1), using a card with a <b>red star</b>, replacing a card or a tile on your board. <b>Lose</b>: visiting a Safe House, the Church ($1k), Informer card, Disguise fixer, a gang biker, the bonus for a completed Business group.</p><h4>Crossing a red line upwards</h4><ol><li>Every player with <b>less</b> notoriety than you, in turn order, moves one officer from any tile to a tile at least <b>one tile closer</b> to you (never two of a kind on a tile, never on the Hospital tile).</li><li>You unlock assets: line 1 → 1 asset; line 2 → 2 assets; line 3 → 1 asset + an <b>Extra Action</b> disc.</li></ol><p>Crossing two lines at once resolves both. If you drop below a line and cross it again later, you get the bonus again.</p><p>Lines: 4–5 players between 2|3, 5|6 and 6|7 (top = 7); 1–3 players between 2|3, 4|5 and 5|6 (top = 6). High notoriety plays first and helps open lockers, but costs money at the end (up to −$100k).</p><div class=\"ex\"><b>Example</b><p>Dynamo has gained 4 this turn (4 red cubes, middle empty). He then visits a Safe House (−1): with no cube in the middle, one red cube returns to the middle. At the adjustment he goes up 3.</p></div><div class=\"ex\"><b>Example</b><p>You gain 2 and then lose 2: 2 red and 2 blue, all 4 cubes used — no change. If you then gain 1 more, a blue cube returns to the middle: 2 red, 1 blue → you go up 1.</p></div><div class=\"ex\"><b>Example</b><p>Dynamo crosses the first line. Pixel (more notoriety) and Wheels (the same) move nobody. Mr. Ash (less) moves a Federal officer from 2 tiles away onto Dynamo's tile — not a SWAT, because Dynamo's tile already has one. Tumbler (less) moves a County officer one tile closer.</p></div><div class=\"note\">In the game, the \"Notoriety this round\" box on your board shows your cubes and where your marker will end up.</div>",
   "pt": "<h4>Durante o teu turno: os 4 cubos</h4><p>O marcador não se mexe logo. Cada <b>ganho</b> passa um dos teus 4 cubos de notoriedade do meio para a <b>caixa vermelha</b>; cada <b>perda</b> passa um para a <b>caixa azul</b>. Se o meio estiver vazio: um ganho devolve um cubo da caixa azul, uma perda devolve um da caixa vermelha; se essa caixa também estiver vazia, não acontece nada. Por isso, numa parte do dia, nunca passas de +4 nem de −4.</p><h4>Depois de todos jogarem: ajustar</h4><p>Por ordem de turno, cada marcador sobe 1 por cada cubo vermelho e desce 1 por cada azul (faz-se primeiro a conta do saldo), e os cubos voltam ao meio. O marcador não desce abaixo do fundo; por cada degrau acima do topo levas um <b>ferimento</b>.</p><h4>Ganhos e perdas</h4><p><b>Ganhas</b>: ao visitar um local onde estão outros jogadores (+1 por cada; não no Hospital), no Hospital (+1), ao usar uma carta com <b>estrela vermelha</b>, ao substituir uma carta ou peça no teu tabuleiro. <b>Perdes</b>: ao visitar uma Casa Segura, na Igreja ($1k), com a carta Informer, o fixer Disfarce, um motard do gang, o bónus de um grupo de Businesses completo.</p><h4>Passar uma linha vermelha a subir</h4><ol><li>Todos os jogadores com <b>menos</b> notoriedade do que tu, por ordem de turno, movem um polícia de qualquer peça para uma peça pelo menos <b>uma peça mais perto</b> de ti (nunca dois do mesmo tipo numa peça, nunca na peça do Hospital).</li><li>Desbloqueias ativos: linha 1 → 1 ativo; linha 2 → 2 ativos; linha 3 → 1 ativo + um disco de <b>Ação Extra</b>.</li></ol><p>Se passares duas linhas de uma vez, resolves as duas. Se desceres abaixo de uma linha e a voltares a passar, recebes o bónus outra vez.</p><p>Linhas: 4–5 jogadores entre 2|3, 5|6 e 6|7 (topo = 7); 1–3 jogadores entre 2|3, 4|5 e 5|6 (topo = 6). Notoriedade alta joga primeiro e ajuda a abrir cacifos, mas custa dinheiro no fim (até −$100k).</p><div class=\"ex\"><b>Exemplo</b><p>O Dynamo já ganhou 4 neste turno (4 cubos vermelhos, meio vazio). Depois visita uma Casa Segura (−1): como não há cubos no meio, um cubo vermelho volta ao meio. No ajuste sobe 3.</p></div><div class=\"ex\"><b>Exemplo</b><p>Ganhas 2 e depois perdes 2: 2 vermelhos e 2 azuis, os 4 cubos usados — fica igual. Se depois ganhares mais 1, um cubo azul volta ao meio: 2 vermelhos, 1 azul → sobes 1.</p></div><div class=\"ex\"><b>Exemplo</b><p>O Dynamo passa a primeira linha. A Pixel (mais notoriedade) e a Wheels (a mesma) não movem ninguém. O Mr. Ash (menos) move um Federal que estava a 2 peças para a peça do Dynamo — não um SWAT, porque a peça do Dynamo já tem um. A Tumbler (menos) move um County uma peça mais perto.</p></div><div class=\"note\">No jogo, a caixa \"Notoriedade desta ronda\" no teu tabuleiro mostra os teus cubos e onde o marcador vai ficar.</div>"
  }
 },
 {
  "id": "exec",
  "icon": "⚡",
  "kw": "executive action ability use card equipment fixer first aid gang asset helipad move police ação executiva habilidade usar helipad mover polícia",
  "title": {
   "en": "Executive actions & helipads",
   "pt": "Ações executivas e helipads"
  },
  "body": {
   "en": "<p>Besides your Move or Rest, you can take <b>any number of executive actions</b> on your turn:</p><ul><li><b>Use a Contact card</b>: pay its cost, gain 1 notoriety if it has a red star, apply the effect, flip it face down.</li><li><b>Use Equipment</b>: flip it to avoid an officer. Flipped back when you Rest.</li><li><b>Use a Fixer</b>: flip it and apply it — <b>free</b>, you only paid when you bought it. <b>One use only</b> — Resting doesn't flip it back; it stays on your board until replaced.</li><li><b>First Aid</b>: flip the token to heal 1 wound. Flipped back when you Rest.</li><li><b>Use a gang biker</b>: return it to your Gang HQ and choose one: lose 1 notoriety; or fly from a helipad tile (1 MP, 1–2 tiles away); or, in the Avoid step, ignore all officers on one tile. When both bikers are back, your control marker returns and the gang is free again.</li><li><b>Use an unlocked asset</b>: pay the cost under its space, apply it, flip it. Once per game; worth $10k at the end.</li></ul><p>Some components show a symbol: <b>footprints</b> = only during Travel; <b>shield</b> = only during Avoid. Without a symbol they can be used at any point of your turn.</p><h4>Helipads</h4><p>A tile with small H icons on its corners has a helipad on <b>every</b> land space and location of that tile. Helicopter abilities (Chopper card, Helicopter fixer, gang biker) need you to be on such a tile. If you fly 2 tiles away, ignore the officers of the tile you fly over; you still avoid the tile you left.</p><h4>Moving police</h4><p>Abilities that move officers can take them from any tile to any other tile, regardless of distance, but never to a tile that already has that type, and never onto the Hospital tile.</p><div class=\"ex\"><b>Example</b><p>Dynamo needs to avoid a Federal officer and has the Boxer card. He pays $2k, flips the card, and because it has a red star he gains 1 notoriety. The star on the card's back is only a reminder: flipping it back up later doesn't give notoriety again.</p></div><div class=\"ex\"><b>Example</b><p>Mr. Ash is at Exit 3 (a tile without helipad). 1 MP to the Industrial area of that tile, then free along the Industrial into the next tile, which has helipads. Now he can use a helicopter ability from there.</p></div><div class=\"note\">In the game, the \"Abilities\" button lists everything you can use right now, and the avoid window offers the options that work for each officer.</div>",
   "pt": "<p>Além de Mover ou Descansar, no teu turno podes fazer <b>quantas ações executivas quiseres</b>:</p><ul><li><b>Usar uma carta de Contacto</b>: pagas o custo, ganhas 1 de notoriedade se tiver estrela vermelha, aplicas o efeito e viras a carta para baixo.</li><li><b>Usar equipamento</b>: viras a peça para evitar um polícia. Volta a virar quando Descansas.</li><li><b>Usar um Fixer</b>: viras a peça e aplicas o efeito — <b>grátis</b>, só pagaste ao comprar. <b>Só se usa uma vez</b> — Descansar não o vira de volta; fica no tabuleiro até ser substituído.</li><li><b>Primeiros Socorros</b>: viras o marcador para curar 1 ferimento. Volta a virar quando Descansas.</li><li><b>Usar um motard do gang</b>: devolve-lo à tua Sede de Gang e escolhes um: perder 1 de notoriedade; ou voar de uma peça com helipad (1 MP, 1–2 peças); ou, no passo Evitar, ignorar toda a polícia de uma peça. Quando os dois motards voltam, o teu marcador de controlo regressa e o gang fica livre.</li><li><b>Usar um ativo desbloqueado</b>: pagas o custo que está por baixo do espaço, aplicas e viras. 1 vez por jogo; vale $10k no fim.</li></ul><p>Algumas peças têm um símbolo: <b>pegadas</b> = só durante a Viagem; <b>escudo</b> = só durante Evitar. Sem símbolo, usam-se em qualquer momento do turno.</p><h4>Helipads</h4><p>Uma peça com pequenos H nos cantos tem helipad em <b>todos</b> os terrenos e locais dessa peça. As habilidades de helicóptero (carta Chopper, fixer Helicóptero, motard) exigem que estejas numa dessas peças. Se voares para 2 peças de distância, ignoras a polícia da peça que sobrevoas; continuas a evitar a peça de onde saíste.</p><h4>Mover polícia</h4><p>As habilidades que movem polícias levam-nos de qualquer peça para qualquer outra, seja qual for a distância, mas nunca para uma peça que já tenha esse tipo, nem para a peça do Hospital.</p><div class=\"ex\"><b>Exemplo</b><p>O Dynamo tem de evitar um Federal e tem a carta Boxer. Paga $2k, vira a carta e, como tem estrela vermelha, ganha 1 de notoriedade. A estrela no verso é só um lembrete: quando a carta volta a virar para cima não volta a dar notoriedade.</p></div><div class=\"ex\"><b>Exemplo</b><p>O Mr. Ash está na Saída 3 (uma peça sem helipad). 1 MP para a zona Industrial dessa peça, depois de graça pela Industrial até à peça seguinte, que tem helipads. A partir dali já pode usar uma habilidade de helicóptero.</p></div><div class=\"note\">No jogo, o botão \"Abilities\" mostra tudo o que podes usar nesse momento, e a janela de evitar mostra as opções que servem para cada polícia.</div>"
  }
 },
 {

  "title": {
   "en": "Contact cards",
   "pt": "Cartas de Contacto"
  },
  "body": {
   "en": "<p>Contact cards are services offered by other criminals. When a location lets you <b>take a Contact card</b>, choose one of the face-up cards in the display and then one option:</p><ul><li><b>A — Discard</b> it to the box.</li><li><b>B — Keep</b> it in your <b>leftmost empty</b> Contact space (no card or asset there). Not possible if you have no empty space.</li><li><b>C — Replace</b> one of your Contact cards (even if you have an empty space): gain 1 notoriety and the old card goes to the box.</li></ul><p>Then a new card is drawn to the display (if the deck is empty, nothing is drawn).</p><p>Using a card is an executive action (see <i>Executive actions</i>). Face-down cards flip back up when you Rest, or with Spy 2 / Energy Drink.</p><p>Your cards also count for <b>lockers</b> and <b>Exit tiles</b> (face up and face down count, those under Handcuffs don't) and at the end: 1/2/3/4/5 cards = 0/10/30/60/100k.</p><div class=\"note\">On each card: the footprints badge means \"use while travelling\", the shield badge \"use while avoiding\". With 2 players and solo, new cards enter on the left and Vega/Moreno take the rightmost ones.</div>",
   "pt": "<p>As cartas de Contacto são serviços oferecidos por outros criminosos. Quando um local te deixa <b>tirar uma carta de Contacto</b>, escolhes uma das cartas viradas para cima na mostra e depois uma opção:</p><ul><li><b>A — Descartar</b> para a caixa.</li><li><b>B — Ficar</b> com ela no teu espaço de Contacto <b>vazio mais à esquerda</b> (sem carta nem ativo). Não é possível se não tiveres espaço vazio.</li><li><b>C — Substituir</b> uma das tuas cartas (mesmo que tenhas espaço vazio): ganhas 1 de notoriedade e a carta antiga vai para a caixa.</li></ul><p>Depois tira-se uma carta nova para a mostra (se o baralho acabou, não se tira nenhuma).</p><p>Usar uma carta é uma ação executiva (ver <i>Ações executivas</i>). As cartas viradas para baixo voltam a virar quando Descansas, ou com Spy 2 / Energy Drink.</p><p>As tuas cartas contam também para os <b>cacifos</b> e as <b>peças de saída</b> (contam as viradas para cima e para baixo, não as que estão debaixo de Algemas) e no fim: 1/2/3/4/5 cartas = 0/10/30/60/100k.</p><div class=\"note\">Em cada carta: o símbolo das pegadas quer dizer \"usa-se a viajar\", o do escudo \"usa-se a evitar\". Com 2 jogadores e no solo, as cartas novas entram pela esquerda e a Vega/o Moreno levam as da direita.</div>"
  }
 },

  "body": {
   "en": "<p>Six Businesses in two groups: <span class=\"grp purple\">Casino, Bar, Restaurant</span> and <span class=\"grp blue\">Gym, Nightclub, Art Gallery</span>. You may visit each one <b>only once</b> in the game. When you visit:</p><ol><li>Gain 1 notoriety per other player there.</li><li>Take the <b>top cube</b> of your income track (your income drops) and look at your <b>Getaway Plan</b>: if it shows an amount, the cube goes in the white hexagon and you score that amount <b>at the end</b>; if it shows the <b>$</b> income symbol, the cube goes in the $ hexagon and you <b>receive income now</b>.</li><li>Take a Contact card.</li></ol><p><b>Getaway Plan</b>: secret card, revealed only at the end. Each group has two amounts (adding up to $150k) and one $; the whole card is worth $450k.</p><p><b>Closing</b>: after <b>2 visits</b> (1–3 players) or <b>3 visits</b> (4–5 players) the Business closes. To visit a closed one you need a <b>key</b> (any colour) or the <b>Master Key</b> asset; the key is flipped and never comes back. The Business stays closed for the others.</p><p><b>Group bonus</b> (once per group, at the end of the turn you complete it): an <b>Extra Action</b> disc, or <b>unlock an asset and lose 1 notoriety</b>.</p><div class=\"ex\"><b>Example</b><p>Your plan shows Bar = $, Casino = 60, Restaurant = 90. You visit the Bar: you take your top income cube (income 9 → 8) and since the Bar shows $, you receive income right away: $8k. Later you visit the Casino: income goes to 7, no money now, but $60k at the end.</p></div><div class=\"note\">Every visit to a Business or Safe House lowers your income for the rest of the game — a reason to visit the \"$\" ones early.</div>",
   "pt": "<p>Seis Businesses em dois grupos: <span class=\"grp purple\">Casino, Bar, Restaurante</span> e <span class=\"grp blue\">Ginásio, Discoteca, Galeria de Arte</span>. Cada um só pode ser visitado <b>uma vez</b> por ti em todo o jogo. Ao visitar:</p><ol><li>Ganhas 1 de notoriedade por cada outro jogador lá.</li><li>Tiras o <b>cubo de cima</b> do teu trilho de rendimento (o rendimento desce) e vês o teu <b>Plano de Fuga</b>: se mostra um valor, o cubo vai para o hexágono branco e pontuas esse valor <b>no fim</b>; se mostra o símbolo <b>$</b>, o cubo vai para o hexágono $ e <b>recebes rendimento já</b>.</li><li>Tiras uma carta de Contacto.</li></ol><p><b>Plano de Fuga</b>: carta secreta, só se revela no fim. Cada grupo tem dois valores (que somam $150k) e um $; a carta toda vale $450k.</p><p><b>Fechar</b>: ao fim de <b>2 visitas</b> (1–3 jogadores) ou <b>3 visitas</b> (4–5 jogadores) o Business fecha. Para visitar um fechado precisas de uma <b>chave</b> (qualquer cor) ou do ativo <b>Chave Mestra</b>; a chave é virada e não volta. O Business continua fechado para os outros.</p><p><b>Bónus de grupo</b> (1 vez por grupo, no fim do turno em que o completas): um disco de <b>Ação Extra</b>, ou <b>desbloquear um ativo e perder 1 de notoriedade</b>.</p><div class=\"ex\"><b>Exemplo</b><p>O teu plano mostra Bar = $, Casino = 60, Restaurante = 90. Visitas o Bar: tiras o cubo de cima do rendimento (rendimento 9 → 8) e, como o Bar mostra $, recebes rendimento já: $8k. Mais tarde visitas o Casino: o rendimento passa a 7, não recebes nada agora, mas são $60k no fim.</p></div><div class=\"note\">Cada visita a um Business ou Casa Segura baixa o teu rendimento para o resto do jogo — uma razão para visitar cedo os que têm \"$\".</div>"
  }
 },

  "body": {
   "en": "<p>Three Safe Houses, each visited <b>only once</b>. They never close. When you visit:</p><ol><li>Gain 1 notoriety per other player there.</li><li>Take your top income cube and check your Getaway Plan (money at the end, or income now) — like a Business.</li><li><b>Lose 1 notoriety.</b></li><li>Take <b>one of the keys</b> left there (green, black or brown), if any. Keys open lockers of their colour, and any key opens a closed Business.</li><li>You <b>may buy a Fixer</b>: choose any one, pay its price and put it in an empty item space (not one with an asset). If you put it on a space with another tile, gain 1 notoriety and that tile goes to the box.</li></ol><p><b>Bonus for all 3</b> (once, at the end of the turn you complete them): an <b>Extra Action</b> disc, or <b>unlock an asset and receive income</b>.</p><p><b>Fixers</b> (one use each): Telephone $2k (take a Contact card), Safe $3k (receive income), Disguise $2k (lose 1 notoriety), ID Card $4k (Extra Action disc), First Aid Kit $1k (heal 1 wound), Motorcycle $2k (one gang biker ability, no biker needed), Energy Drink $2k (flip back all your Equipment and Contact cards), Helicopter $1k (fly from a helipad tile).</p><div class=\"ex\"><b>Example</b><p>Wheels visits Safe House 2 alone. Her plan says SH 2 = 80: the cube goes to the \"end\" hexagon. She loses 1 notoriety, takes the black key that was left there, and buys an ID Card for $4k.</p></div>",
   "pt": "<p>Três Casas Seguras, cada uma visitada <b>uma vez</b>. Nunca fecham. Ao visitar:</p><ol><li>Ganhas 1 de notoriedade por cada outro jogador lá.</li><li>Tiras o cubo de cima do rendimento e vês o Plano de Fuga (dinheiro no fim, ou rendimento já) — como num Business.</li><li><b>Perdes 1 de notoriedade.</b></li><li>Tiras <b>uma das chaves</b> que lá estão (verde, preta ou castanha), se houver. As chaves abrem cacifos da sua cor, e qualquer chave abre um Business fechado.</li><li><b>Podes comprar um Fixer</b>: escolhes um qualquer, pagas o preço e pões num espaço de item vazio (sem ativo). Se o puseres num espaço com outra peça, ganhas 1 de notoriedade e essa peça vai para a caixa.</li></ol><p><b>Bónus pelas 3</b> (1 vez, no fim do turno em que as completas): um disco de <b>Ação Extra</b>, ou <b>desbloquear um ativo e receber rendimento</b>.</p><p><b>Fixers</b> (cada um só se usa uma vez): Telefone $2k (tirar uma carta de Contacto), Cofre $3k (receber rendimento), Disfarce $2k (perder 1 de notoriedade), Cartão de Identidade $4k (disco de Ação Extra), Kit de Primeiros Socorros $1k (curar 1 ferimento), Mota $2k (uma habilidade de motard, sem precisar de motard), Bebida Energética $2k (virar de volta todo o teu equipamento e cartas), Helicóptero $1k (voar a partir de uma peça com helipad).</p><div class=\"ex\"><b>Exemplo</b><p>A Wheels visita a Casa Segura 2 sozinha. O plano diz CS 2 = 80: o cubo vai para o hexágono \"fim\". Perde 1 de notoriedade, leva a chave preta que lá estava e compra um Cartão de Identidade por $4k.</p></div>"

 },

  "body": {
   "en": "<p>At a Store (A, B, C or D):</p><ol><li>Gain 1 notoriety per other player there.</li><li>You may take a <b>Gas Can</b> (keep up to 2).</li><li>You may buy up to <b>2 different</b> pieces of Equipment (Gas Mask $3k, the others $2k) and put them in empty item spaces. Putting one over another tile: +1 notoriety, the old tile goes to the box.</li><li>If you have the right key, you may open <b>one locker</b>.</li></ol><h4>Lockers</h4><p>To open one you need: the <b>key of its colour</b> (or the Master Key), <b>and</b> your <b>notoriety + Contact cards</b> must reach the locker's number (cards under Handcuffs don't count). Then:</p><ol><li>Flip the key (it's used up).</li><li>Draw tiles from that locker in secret: green = cards + 1, black = cards, brown = cards − 1.</li><li>Keep one, face down, in an empty item space (replacing a tile: +1 notoriety). The others go back and are shuffled.</li></ol><table class=\"rt\"><tr><th></th><th>needs</th><th>tiles</th></tr><tr><td>Green</td><td>1+</td><td>$0, 60, 60, 60, 90k</td></tr><tr><td>Black</td><td>5+</td><td>$0, 70, 70, 100, 100k</td></tr><tr><td>Brown</td><td>8+</td><td>$0, 80, 110, 110, 110k</td></tr></table><div class=\"ex\"><b>Example</b><p>You have notoriety 3 and 3 Contact cards: total 6. With a black key you can open the black locker (needs 5) and draw 3 tiles (= your cards); you keep the best one. The brown locker (needs 8) is still out of reach.</p></div>",
   "pt": "<p>Numa Loja (A, B, C ou D):</p><ol><li>Ganhas 1 de notoriedade por cada outro jogador lá.</li><li>Podes levar uma <b>lata de gasolina</b> (máximo 2).</li><li>Podes comprar até <b>2 equipamentos diferentes</b> (Máscara de gás $3k, os outros $2k) e pô-los em espaços de item vazios. Pôr um por cima de outra peça: +1 de notoriedade e a peça antiga vai para a caixa.</li><li>Se tiveres a chave certa, podes abrir <b>um cacifo</b>.</li></ol><h4>Cacifos</h4><p>Para abrir um precisas: da <b>chave da cor</b> dele (ou da Chave Mestra), <b>e</b> que a tua <b>notoriedade + cartas de Contacto</b> chegue ao número do cacifo (as cartas debaixo de Algemas não contam). Depois:</p><ol><li>Viras a chave (fica gasta).</li><li>Tiras peças desse cacifo em segredo: verde = cartas + 1, preto = cartas, castanho = cartas − 1.</li><li>Guardas uma, virada para baixo, num espaço de item vazio (substituir uma peça: +1 de notoriedade). As outras voltam e baralham-se.</li></ol><table class=\"rt\"><tr><th></th><th>precisa</th><th>peças</th></tr><tr><td>Verde</td><td>1+</td><td>$0, 60, 60, 60, 90k</td></tr><tr><td>Preto</td><td>5+</td><td>$0, 70, 70, 100, 100k</td></tr><tr><td>Castanho</td><td>8+</td><td>$0, 80, 110, 110, 110k</td></tr></table><div class=\"ex\"><b>Exemplo</b><p>Tens notoriedade 3 e 3 cartas de Contacto: total 6. Com uma chave preta podes abrir o cacifo preto (precisa de 5) e tiras 3 peças (= as tuas cartas); guardas a melhor. O cacifo castanho (precisa de 8) ainda não está ao teu alcance.</p></div>"

 },
 {

  "title": {
   "en": "Hospital, Clinic, Church & Gangs",

  "body": {
   "en": "<h4>Hospital</h4><ol><li>You may pay $1k / $3k / $6k to heal 1 / 2 / 3 wounds.</li><li>Gain 1 notoriety (doctors must report bullet wounds).</li></ol><p>Unlike other locations, you <b>don't</b> gain notoriety for other players at the Hospital. Everyone starts the game here, and its tile never has police.</p><h4>Clinic</h4><ol><li>+1 notoriety per other player.</li><li>You may unlock an asset.</li><li>You may heal 1 wound.</li><li>Take a Contact card.</li></ol><h4>Church</h4><ol><li>+1 notoriety per other player.</li><li>You may pay $1k to lose 1 notoriety.</li><li>You may unlock an asset.</li><li>Take a Contact card.</li></ol><h4>Gang HQ</h4><p>Only if <b>nobody</b> is there and <b>no control marker</b> (yours or another's) is on it:</p><ol><li>Pay $5k (if you can't, you can't visit).</li><li>Take both gang bikers.</li><li>Put one of your control markers there.</li></ol><p>Each biker is used as an executive action (see <i>Executive actions</i>).</p>",
   "pt": "<h4>Hospital</h4><ol><li>Podes pagar $1k / $3k / $6k para curar 1 / 2 / 3 ferimentos.</li><li>Ganhas 1 de notoriedade (os médicos têm de reportar ferimentos de bala).</li></ol><p>Ao contrário dos outros locais, no Hospital <b>não</b> ganhas notoriedade pelos outros jogadores. Todos começam aqui, e a peça nunca tem polícia.</p><h4>Clínica</h4><ol><li>+1 de notoriedade por cada outro jogador.</li><li>Podes desbloquear um ativo.</li><li>Podes curar 1 ferimento.</li><li>Tiras uma carta de Contacto.</li></ol><h4>Igreja</h4><ol><li>+1 de notoriedade por cada outro jogador.</li><li>Podes pagar $1k para perder 1 de notoriedade.</li><li>Podes desbloquear um ativo.</li><li>Tiras uma carta de Contacto.</li></ol><h4>Sede de Gang</h4><p>Só se <b>ninguém</b> lá estiver e não houver <b>marcador de controlo</b> (teu ou de outro):</p><ol><li>Pagas $5k (se não puderes, não podes visitar).</li><li>Levas os dois motards.</li><li>Pões lá um dos teus marcadores de controlo.</li></ol><p>Cada motard usa-se como ação executiva (ver <i>Ações executivas</i>).</p>"

 },
 {
  "id": "exits",
  "icon": "🚪",
  "kw": "exit open closed patrol exit tile escape cost late fee saída aberta fechada patrulha fugir custo",
  "title": {
   "en": "Exits & escaping",
   "pt": "Saídas e fuga"
  },
  "body": {
   "en": "<p>There are 6 patrol cards (2 per exit); one is removed at setup, so 5 come out: 2 on Day 1, 2 on Day 2, 1 on Day 3. An exit with <b>2 patrol cards is closed</b>; on Day 3 exactly one exit is still open.</p><h4>Visiting an exit</h4><ol><li>+1 notoriety per other player.</li><li><b>Open</b> exit: you may receive income. <b>Closed</b> exit: either receive income <b>or</b> take an Exit tile — draw as many tiles as your Contact cards, keep one face down in an empty item space (if none, you must replace a tile, +1 notoriety), return the rest.</li><li>Take a Contact card.</li></ol><h4>Escaping (Day 3 only)</h4><p>Travel to the open exit and choose to escape, during the Travel step (or at the start of your turn if you're already there). You don't visit. In the Avoid step you must also avoid the officers on the <b>exit's own tile</b>, because you're leaving it too. Then pay the exit cost — if you can't, you're <b>arrested</b>.</p><table class=\"rt\"><tr><th>players</th><th>1st</th><th>2nd</th><th>3rd</th><th>4th</th><th>5th</th></tr><tr><td>2</td><td>0</td><td>10</td><td></td><td></td><td></td></tr><tr><td>3</td><td>0</td><td>5</td><td>10</td><td></td><td></td></tr><tr><td>4</td><td>0</td><td>5</td><td>10</td><td>10</td><td></td></tr><tr><td>5</td><td>0</td><td>5</td><td>5</td><td>10</td><td>10</td></tr></table><p>As soon as the first player escapes, everyone else pays <b>$1k before each of their turns</b> (always $1k) or is arrested. You may visit the open exit and escape only on your next turn. Your notoriety is still adjusted on the turn you escape; officers moved towards you go to the exit's tile.</p><div class=\"ex\"><b>Example</b><p>4 players. Mr. Ash is the second to escape. He pays $1k to take his turn, moves to the exit, tries to avoid the Federal and County officers (including those on the exit tile) and pays $5k to leave.</p></div>",
   "pt": "<p>Há 6 cartas de patrulha (2 por saída); tira-se uma na preparação, por isso saem 5: 2 no Dia 1, 2 no Dia 2 e 1 no Dia 3. Uma saída com <b>2 cartas de patrulha está fechada</b>; no Dia 3 fica exatamente uma saída aberta.</p><h4>Visitar uma saída</h4><ol><li>+1 de notoriedade por cada outro jogador.</li><li>Saída <b>aberta</b>: podes receber rendimento. Saída <b>fechada</b>: ou recebes rendimento <b>ou</b> tiras uma peça de saída — tiras tantas peças como cartas de Contacto, guardas uma virada para baixo num espaço de item vazio (se não houver, tens de substituir uma peça, +1 de notoriedade) e devolves as outras.</li><li>Tiras uma carta de Contacto.</li></ol><h4>Fugir (só no Dia 3)</h4><p>Viaja até à saída aberta e escolhe fugir, durante o passo Viajar (ou no início do teu turno, se já lá estiveres). Não há visita. No passo Evitar tens de evitar também a polícia da <b>própria peça da saída</b>, porque também a estás a deixar. Depois pagas o custo de saída — se não puderes, és <b>preso</b>.</p><table class=\"rt\"><tr><th>jogadores</th><th>1.º</th><th>2.º</th><th>3.º</th><th>4.º</th><th>5.º</th></tr><tr><td>2</td><td>0</td><td>10</td><td></td><td></td><td></td></tr><tr><td>3</td><td>0</td><td>5</td><td>10</td><td></td><td></td></tr><tr><td>4</td><td>0</td><td>5</td><td>10</td><td>10</td><td></td></tr><tr><td>5</td><td>0</td><td>5</td><td>5</td><td>10</td><td>10</td></tr></table><p>Assim que o primeiro jogador foge, todos os outros pagam <b>$1k antes de cada turno</b> (sempre $1k) ou são presos. Podes visitar a saída aberta e só fugir no turno seguinte. A tua notoriedade ainda é ajustada no turno em que foges; os polícias movidos na tua direção vão para a peça da saída.</p><div class=\"ex\"><b>Exemplo</b><p>4 jogadores. O Mr. Ash é o segundo a fugir. Paga $1k para poder jogar, vai até à saída, tenta evitar o Federal e o County (incluindo os da peça da saída) e paga $5k para sair.</p></div>"
  }
 },

  "title": {
   "en": "Assets & Extra Actions",
   "pt": "Ativos e Ações Extra"
  },
  "body": {
   "en": "<p>You have 7 Asset tiles. The <b>Extra Action</b> asset starts unlocked on the $5k space; 3 others start <b>blocking item spaces</b> and 3 <b>blocking Contact spaces</b>.</p><p><b>Unlocking</b>: choose any locked asset and move it to the <b>most expensive empty</b> asset space (the spaces cost $5, 4, 3, 2, 1 and the last one is free). This frees the space it was blocking. When you unlock your last one and there's no space left, it's removed from the game.</p><p>You unlock by: crossing notoriety lines (1/2/1), Resting, paying $3k at income (notoriety below the first line), the Clinic, the Church, Spy 3, group bonuses, Gold Bars (Upgrade Pack).</p><p><b>Using</b> an asset: pay the cost under its space, apply it, flip it. Once per game. Each used asset is worth <b>$10k</b> at the end. The assets: Extra Action disc; Master Key (open any closed Business or any locker); avoid all officers on one tile; heal 1 wound; move a County / Federal / SWAT officer.</p><h4>Extra Action discs</h4><p>Let you play at Night and Dawn (one disc per turn). You get them from the Extra Action asset, ID Card fixer, the Fixer Contact card, group bonuses and crossing the third notoriety line.</p><div class=\"ex\"><b>Example</b><p>Your unlocked row has the Extra Action asset on $5 and nothing else. You cross the first line and unlock the Master Key: it goes to the $4 space, and the item space it was blocking is now free for equipment. Using it later costs $4k.</p></div>",
   "pt": "<p>Tens 7 ativos. O ativo de <b>Ação Extra</b> começa desbloqueado no espaço de $5k; 3 outros começam a <b>bloquear espaços de item</b> e 3 a <b>bloquear espaços de Contacto</b>.</p><p><b>Desbloquear</b>: escolhes qualquer ativo bloqueado e passas para o espaço de ativo <b>vazio mais caro</b> (os espaços custam $5, 4, 3, 2, 1 e o último é grátis). Assim libertas o espaço que ele bloqueava. Quando desbloqueias o último e já não há espaço, sai do jogo.</p><p>Desbloqueias: ao passar linhas de notoriedade (1/2/1), ao Descansar, ao pagar $3k no rendimento (notoriedade abaixo da primeira linha), na Clínica, na Igreja, com Spy 3, com bónus de grupos, com Barras de Ouro (Upgrade Pack).</p><p><b>Usar</b> um ativo: pagas o custo que está por baixo do espaço, aplicas e viras. 1 vez por jogo. Cada ativo usado vale <b>$10k</b> no fim. Os ativos: disco de Ação Extra; Chave Mestra (abrir qualquer Business fechado ou qualquer cacifo); evitar toda a polícia de uma peça; curar 1 ferimento; mover um polícia County / Federal / SWAT.</p><h4>Discos de Ação Extra</h4><p>Permitem jogar à Noite e de Madrugada (um disco por turno). Ganhas com o ativo de Ação Extra, o fixer Cartão de Identidade, a carta de Contacto Fixer, os bónus de grupos e ao passar a terceira linha de notoriedade.</p><div class=\"ex\"><b>Exemplo</b><p>A tua fila de desbloqueados tem o ativo de Ação Extra no $5 e mais nada. Passas a primeira linha e desbloqueias a Chave Mestra: vai para o espaço de $4, e o espaço de item que ela bloqueava fica livre para equipamento. Usá-la mais tarde custa $4k.</p></div>"
  }
 },

  "body": {
   "en": "<h4>Contact cards</h4><ul><li><b>Informer</b>: lose 1 notoriety.</li><li><b>Fighter / Boxer / Ninja</b>: avoid all officers of the shown types on one tile.</li><li><b>Stunt</b>: avoid 1 officer of any type.</li><li><b>Fast Car</b>: avoid all officers on one tile.</li><li><b>Bribe / Rally</b>: move an officer of the shown type to any tile without that type.</li><li><b>Snitch</b>: remove an officer of the shown type from the game.</li><li><b>Medic</b>: heal 1 wound.</li><li><b>Medevac</b>: go straight to the Hospital; you can't move again this turn.</li><li><b>Chopper</b>: from a helipad tile, fly to a location or land space 1–2 tiles away.</li><li><b>Sewer</b>: move to a tile 2 tiles away (as on the card), ignoring the officers in between. Free if you come out in the same land type you went in, otherwise 1 MP.</li><li><b>Jet Ski</b>: cross any one body of water this turn.</li><li><b>Gang</b>: one of the 3 gang biker abilities.</li><li><b>Fixer</b>: take an Extra Action disc.</li><li><b>General Store</b>: receive income.</li><li><b>Spy 1</b>: take a Contact card. <b>Spy 2</b>: flip back all your Equipment and Contact cards. <b>Spy 3</b>: unlock an asset.</li></ul><h4>Equipment (flips back when you Rest)</h4><ul><li><b>Hat</b> $2k: avoid a County. <b>Vest</b> $2k: avoid a Federal. <b>Helmet</b> $2k: avoid a SWAT. <b>Gas Mask</b> $3k: avoid a SWAT or a County.</li></ul><h4>Fixers (one use)</h4><p>See <i>Safe Houses &amp; Fixers</i>.</p><div class=\"note\">In the game, hover or long-press any card to see its cost and effect.</div>",
   "pt": "<h4>Cartas de Contacto</h4><ul><li><b>Informer</b>: perdes 1 de notoriedade.</li><li><b>Fighter / Boxer / Ninja</b>: evitas todos os polícias dos tipos indicados numa peça.</li><li><b>Stunt</b>: evitas 1 polícia de qualquer tipo.</li><li><b>Fast Car</b>: evitas toda a polícia de uma peça.</li><li><b>Bribe / Rally</b>: moves um polícia do tipo indicado para qualquer peça sem esse tipo.</li><li><b>Snitch</b>: retiras do jogo um polícia do tipo indicado.</li><li><b>Medic</b>: curas 1 ferimento.</li><li><b>Medevac</b>: vais diretamente para o Hospital; não te podes mexer mais nesse turno.</li><li><b>Chopper</b>: a partir de uma peça com helipad, voas para um local ou terreno a 1–2 peças.</li><li><b>Sewer</b>: vais para uma peça a 2 peças de distância (como na carta), ignorando a polícia pelo meio. É grátis se saíres no mesmo terreno em que entraste; se não, 1 MP.</li><li><b>Jet Ski</b>: atravessas uma massa de água qualquer neste turno.</li><li><b>Gang</b>: uma das 3 habilidades dos motards.</li><li><b>Fixer</b>: ganhas um disco de Ação Extra.</li><li><b>General Store</b>: recebes rendimento.</li><li><b>Spy 1</b>: tiras uma carta de Contacto. <b>Spy 2</b>: viras de volta todo o teu equipamento e cartas. <b>Spy 3</b>: desbloqueias um ativo.</li></ul><h4>Equipamento (volta a virar quando Descansas)</h4><ul><li><b>Boné</b> $2k: evita um County. <b>Colete</b> $2k: evita um Federal. <b>Capacete</b> $2k: evita um SWAT. <b>Máscara de gás</b> $3k: evita um SWAT ou um County.</li></ul><h4>Fixers (uso único)</h4><p>Ver <i>Casas Seguras e Fixers</i>.</p><div class=\"note\">No jogo, passa o rato ou carrega sem largar numa carta para veres o custo e o efeito.</div>"

 {

  "kw": "score scoring end points tie winner pontuação fim pontos empate vencedor",
  "title": {
   "en": "Final scoring",
   "pt": "Pontuação final"
  },
  "body": {
   "en": "<p>The game ends after Day 3, or when everyone has escaped or been arrested. <b>Only players who escaped can win.</b> First, discard 1 Contact card per Handcuffs card (it can be one under the handcuffs). Then add:</p><ul><li>Businesses group 1 and group 2 you visited (values on your Getaway Plan; the $ ones were already paid)</li><li>Safe Houses you visited (Getaway Plan values)</li><li>Cash in hand</li><li>$10k per <b>used</b> asset</li><li>Contact cards: 1/2/3/4/5 = 0/10/30/60/100k</li><li>Locker and Exit bags</li></ul><p>Subtract: the notoriety penalty next to the track (up to −$100k) and <b>$20k per red wound</b>.</p><p><b>Ties</b>: most cash in hand, then least notoriety, then fewest wounds; otherwise shared victory.</p><table class=\"rt\"><tr><th>notoriety</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th></tr><tr><td>4–5 players</td><td>0</td><td>−10</td><td>−30</td><td>−40</td><td>−60</td><td>−80</td><td>−100</td></tr><tr><td>1–3 players</td><td>0</td><td>−10</td><td>−30</td><td>−50</td><td>−80</td><td>−100</td><td></td></tr></table>",
   "pt": "<p>O jogo acaba no fim do Dia 3, ou quando todos já fugiram ou foram presos. <b>Só quem fugiu pode ganhar.</b> Primeiro, descartas 1 carta de Contacto por cada carta de Algemas (pode ser uma que esteja debaixo das algemas). Depois somas:</p><ul><li>Businesses do grupo 1 e do grupo 2 que visitaste (valores do Plano de Fuga; os $ já foram pagos)</li><li>Casas Seguras que visitaste (valores do Plano de Fuga)</li><li>Dinheiro na mão</li><li>$10k por cada ativo <b>usado</b></li><li>Cartas de Contacto: 1/2/3/4/5 = 0/10/30/60/100k</li><li>Sacos dos cacifos e das saídas</li></ul><p>Subtrais: a penalização da notoriedade ao lado do trilho (até −$100k) e <b>$20k por cada ferimento vermelho</b>.</p><p><b>Empates</b>: mais dinheiro na mão, depois menos notoriedade, depois menos ferimentos; senão a vitória é partilhada.</p><table class=\"rt\"><tr><th>notoriedade</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th></tr><tr><td>4–5 jogadores</td><td>0</td><td>−10</td><td>−30</td><td>−40</td><td>−60</td><td>−80</td><td>−100</td></tr><tr><td>1–3 jogadores</td><td>0</td><td>−10</td><td>−30</td><td>−50</td><td>−80</td><td>−100</td><td></td></tr></table>"
  }
 },
 {

   "en": "2 players: Inspector Vega",
   "pt": "2 jogadores: Inspetora Vega"
  },
  "body": {
   "en": "<p>Vega is a game-controlled third player. She gets no income and doesn't place tiles (each of you places 2). She counts as another player for crowding, and as a police officer <b>of any type</b> when you avoid (so any gear works on her; she can't be removed, only moved).</p><p>On her turn she reveals Inspector cards until one shows a location in the city (open exits are ignored on Days 1–2) and jumps there. Then: Businesses +1 notoriety, a cube (closing them faster) and she discards the 2 rightmost Contact cards; Safe Houses −1, discard a Fixer and a key; Stores ±1, discard 2 Contacts and a locker tile; closed exits −1, discard an Exit tile and 2 Contacts. She gets Extra Actions from discarded Fixer cards and completed groups, and uses them at night.</p><p>In this mode new Contact cards enter on the <b>left</b>, so the rightmost ones are the next to go.</p>",
   "pt": "<p>A Vega é uma terceira jogadora controlada pelo jogo. Não recebe rendimento nem coloca peças (cada um de vós coloca 2). Conta como outro jogador para a notoriedade nos locais e como polícia <b>de qualquer tipo</b> quando evitas (qualquer equipamento serve contra ela; não pode ser retirada, só movida).</p><p>No turno dela revelam-se cartas de Inspetora até sair um local que esteja na cidade (as saídas abertas ignoram-se nos Dias 1–2) e ela salta para lá. Depois: Businesses +1 notoriedade, um cubo (fecham mais depressa) e descarta as 2 cartas de Contacto mais à direita; Casas Seguras −1, descarta um Fixer e uma chave; Lojas ±1, descarta 2 Contactos e uma peça de cacifo; saídas fechadas −1, descarta uma peça de saída e 2 Contactos. Ganha Ações Extra com cartas Fixer descartadas e grupos completos, e usa-as à noite.</p><p>Neste modo as cartas novas entram pela <b>esquerda</b>, por isso as da direita são as próximas a sair.</p>"
  }
 },
 {
  "id": "solo",
  "icon": "👮‍♂️",
  "kw": "solo one player costa lieutenant bribe tenente subornar um jogador",
  "title": {
   "en": "Solo: Lt. Moreno",
   "pt": "Solo: Tenente Moreno"
  },
  "body": {
   "en": "<p>Play with Vega <b>and</b> Lt. Moreno. You place all 4 tiles each day. Moreno starts second in turn order, Vega third, so on Day 1 they act before you.</p><p>Moreno draws Lieutenant cards until one is on your tile or next to it (if none, he loses the turn). He <b>keeps</b> what Vega would discard: the rightmost Contact card at Businesses, 2 tiles from lockers or closed exits (Store D: one of each colour, scoring only the best). He never visits closed Businesses and always escapes on Day 3.</p><p>He's corrupt: leaving a tile where Moreno stands costs a <b>$3k bribe</b> (mandatory if you can pay), otherwise 2 wounds. Avoid-all abilities and move-officer abilities also work on him.</p><p>Moreno scores his Getaway Plan, Contacts and his stacks (both tiles; a $0 tile counts as the best of its kind), minus notoriety and any exit cost/fees. Beat his score to win. The <i>easy</i> option makes him take 1 tile instead of 2.</p>",
   "pt": "<p>Joga-se com a Vega <b>e</b> o Tenente Moreno. Colocas tu as 4 peças em cada dia. O Moreno começa em 2.º na ordem de turno e a Vega em 3.º, por isso no Dia 1 jogam antes de ti.</p><p>O Moreno tira cartas de Tenente até sair um local na tua peça ou numa peça vizinha (se não houver, perde a vez). Ele <b>guarda</b> o que a Vega descartaria: a carta de Contacto mais à direita nos Businesses, 2 peças dos cacifos ou das saídas fechadas (Loja D: uma de cada cor, só conta a melhor). Nunca visita Businesses fechados e foge sempre no Dia 3.</p><p>É corrupto: sair de uma peça onde está o Moreno custa um <b>suborno de $3k</b> (obrigatório se puderes pagar); se não, levas 2 ferimentos. As habilidades de evitar toda a polícia e de mover polícias também funcionam com ele.</p><p>O Moreno pontua o Plano de Fuga, os Contactos e as pilhas (as 2 peças; uma peça de $0 vale o máximo desse tipo), menos a notoriedade e o custo/taxas de saída. Tens de ter mais pontos do que ele. A opção <i>fácil</i> faz com que tire 1 peça em vez de 2.</p>"
  }
 },
 {

  "title": {

   "pt": "Upgrade Pack"

  "kw": "faq question doubt pergunta dúvida revisit again twice same turn gang fixer pay replace slot full gas extra action locker water ferry stay",

   "en": "FAQ",
   "pt": "Perguntas frequentes"
