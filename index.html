:root{
  --bg:#121419;--bg2:#1a1e26;--bg3:#232834;--line:#2e3442;--paper:#f1e7d0;--paper2:#e4d6b6;--paper3:#d6c49c;--ink:#1d1b18;--ink2:#5a5246;
  --red:#d23b33;--red2:#a82820;--mustard:#e8b546;--teal:#36a99c;--muted:#8d93a0;--text:#e9e6df;
  --I:#3b3f47;--C:#cdbf9d;--R:#5ea54a;--W:#2f72c6;
  --orange:#f08a24;--purple:#9050c8;--pink:#e85d9e;--yellow:#f2c629;--green:#3eae50;
  --county:#3d9be0;--federal:#d23b33;--swat:#202226;
  --ff-type:'Special Elite','Courier New',monospace;--ff-ui:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--ff-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --speed:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ff-body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:var(--ff-ui);font-size:15px;letter-spacing:.3px;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--bg3);color:var(--text);transition:transform .12s, background .15s, box-shadow .15s}
button:hover{background:#2c3342}button:active{transform:scale(.96)}button:disabled{opacity:.4;cursor:default;transform:none}
button.pri{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red2)}button.pri:hover{background:#e04a41}
button.gold{background:var(--mustard);color:#2a1f05;box-shadow:0 3px 0 #b8862a}
button.ghost{background:transparent;border:1px solid var(--line)}
.ic{width:1.2em;height:1.2em;vertical-align:-.22em;flex:none}
.hidden{display:none!important}
/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 70% 10%,#2a2131 0,transparent 60%),radial-gradient(900px 600px at 10% 90%,#162a2f 0,transparent 60%),var(--bg);overflow:auto;padding:24px 16px}
.logo{font-family:var(--ff-type);font-size:clamp(64px,13vw,150px);letter-spacing:.06em;color:var(--paper);text-shadow:0 0 0 #000,4px 4px 0 var(--red);line-height:1;transform:rotate(-2deg)}
.logo span{display:inline-block;animation:flick 4s infinite}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.4}96%{opacity:1}97%{opacity:.6}}
.tag{font-family:var(--ff-ui);text-transform:uppercase;letter-spacing:.35em;color:var(--mustard);margin:10px 0 34px;text-align:center}
.menu-btns{display:flex;flex-direction:column;gap:12px;min-width:260px}
.menu-btns button{font-size:20px;padding:13px}
.tape{position:absolute;background:var(--mustard);color:#1d1b18;font-family:var(--ff-ui);font-weight:700;letter-spacing:.3em;padding:6px 60px;white-space:nowrap;opacity:.9}
.lang-switch{display:flex;gap:6px;margin-top:22px}.lang-switch button{padding:6px 12px}.lang-switch button.on{background:var(--paper);color:var(--ink)}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 10px 30px #0008,inset 0 0 40px #c9b48a55;background-image:repeating-linear-gradient(0deg,transparent 0 27px,#0000000a 27px 28px)}
.setup{width:min(720px,100%);padding:22px 24px 26px;position:relative}
.setup h2{font-family:var(--ff-type);font-size:28px;margin:0 0 4px}
.setup .hint{color:var(--ink2);font-size:14px;margin-bottom:14px}
.seat{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed #0002}
.seat .sw{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 -3px 0 #0003}
.seat .nm{font-family:var(--ff-ui);font-size:18px;flex:1}
.seg{display:flex;background:#0000000f;border-radius:8px;padding:3px;gap:2px}
.seg button{background:transparent;color:var(--ink);padding:6px 11px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--paper)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:14px 0}
.opt label{display:block;font-family:var(--ff-ui);font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);margin-bottom:4px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--red)}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
/* ---------- game layout ---------- */
#game{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);grid-template-rows:50px 1fr auto;grid-template-areas:"top top" "map side" "bar side"}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 8px;min-width:0;overflow:hidden;background:linear-gradient(#1c2029,#161920);border-bottom:1px solid var(--line);z-index:5}
#top .daybox{font-family:var(--ff-type);font-size:20px;color:var(--paper);white-space:nowrap}
.timeline{display:flex;gap:4px;align-items:center}
.tl{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);color:var(--muted);font-size:11px;position:relative;transition:all .3s}
.tl.on{background:var(--mustard);color:#221a05;transform:scale(1.15);box-shadow:0 0 0 3px #e8b54633}
.tl.past{opacity:.45}.tl.opt{border:1px dashed #fff3}
.exits{display:flex;gap:6px;margin-left:auto}
.exitb{display:flex;align-items:center;gap:4px;white-space:nowrap;padding:4px 8px;border-radius:6px;background:#f6d64a;color:#2a2205;font-family:var(--ff-type);font-size:14px;box-shadow:0 2px 0 #b89d2a;transform:rotate(-1.5deg)}
.exitb .pc{display:flex;gap:2px}.exitb .pc i{width:8px;height:12px;border-radius:2px;background:#0003}.exitb .pc i.on{background:var(--red)}
.exitb.closed{background:#7a7a7a;color:#eee;box-shadow:0 2px 0 #555;text-decoration:line-through}
.exitb.last{outline:2px solid #fff;animation:pulse 1.4s infinite}
.tbtn{padding:7px 9px;background:transparent;border:1px solid var(--line)}
#mapwrap{grid-area:map;position:relative;overflow:hidden;background:radial-gradient(900px 600px at 50% 40%,#1e2430,#111318)}
#map{width:100%;height:100%;display:block;touch-action:none}
#side{grid-area:side;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:4}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border-radius:0;background:transparent;padding:11px 4px;color:var(--muted);font-size:15px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--red)}
.panel{flex:1;overflow:auto;padding:10px;min-height:0}
#bar{grid-area:bar;background:linear-gradient(#171a21,#12141a);border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px;z-index:6}
#ticker{font-size:13px;color:var(--muted);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker b{color:var(--text);font-weight:500}
#prompt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#prompt .msg{font-family:var(--ff-ui);font-size:17px;flex:1 1 220px;min-width:180px}
#prompt .msg small{display:block;color:var(--muted);font-family:var(--ff-body);font-size:13px}
.who{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px #0005}
@media (max-width:900px),(max-height:520px){
  #game{grid-template-columns:minmax(0,1fr);grid-template-rows:46px minmax(0,1fr) auto;grid-template-areas:"top" "map" "bar"}
  #side{position:fixed;right:0;top:46px;bottom:0;width:min(380px,92vw);transform:translateX(105%);transition:transform .25s;box-shadow:-10px 0 30px #0008}
  #side.open{transform:none}
  #top .daybox{font-size:16px}.tl{width:22px;height:22px}
  .exitb{font-size:12px;padding:3px 6px}
}
@media (min-width:901px) and (min-height:521px){#sideToggle{display:none}}
@media (max-width:620px){.exitb .xl{display:none}.timeline .tl:not(.on){display:none}#top .daybox.ph{display:none}.exitb{font-size:11px;padding:2px 5px;gap:2px}.exitb .pc i{width:5px;height:9px}#bSpeed span,.tbtn .lbl{display:none}#top{gap:6px}.tbtn{padding:6px 7px}}
@media (max-height:520px){#bar{padding:4px 8px;gap:3px}#prompt .msg{font-size:15px}#prompt .msg small{display:none}#ticker{display:none}#sheet{max-height:78%}}
/* ---------- map ---------- */
.cell-slot{fill:#ffffff06;stroke:#ffffff1c;stroke-width:2;stroke-dasharray:6 6}
.cell-slot.start{fill:#ffffff0d}
.cell-slot.legal{fill:#e8b54622;stroke:var(--mustard);stroke-dasharray:none;animation:glow 1.2s infinite alternate;cursor:pointer}
@keyframes glow{from{fill-opacity:.15}to{fill-opacity:.55}}
.tile-edge{fill:none;stroke:#0b0d10;stroke-width:3}
.loc{cursor:default}
.loc .ring{transition:all .2s}
.loc.dest{cursor:pointer}
.loc.dest .halo{fill:none;stroke:#fff;stroke-width:5;animation:halo 1.1s infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{stroke-opacity:.95;transform:scale(1)}100%{stroke-opacity:0;transform:scale(1.6)}}
.loc.dest.esc .halo{stroke:var(--mustard)}
.loc.sel .ring{stroke:var(--mustard)!important;stroke-width:6!important}
.loc .badge{font-family:var(--ff-ui);font-weight:700}
.closedX{opacity:.85}
.path-prev{fill:none;stroke:var(--mustard);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 12;animation:dash 0.6s linear infinite;filter:drop-shadow(0 0 4px #000)}
@keyframes dash{to{stroke-dashoffset:-14}}
.copin.pick{cursor:pointer;animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.pawn{filter:drop-shadow(0 3px 2px #0009)}
.cell-dest{fill:#e8b54633;stroke:var(--mustard);stroke-width:4;cursor:pointer;animation:glow 1s infinite alternate}
/* ---------- side panels ---------- */
.pcard{background:var(--bg3);border-radius:10px;padding:10px;margin-bottom:10px;position:relative;border-left:5px solid var(--c,#888)}
.pcard.cur{box-shadow:0 0 0 2px var(--c,#888)}
.pcard h3{margin:0;font-family:var(--ff-ui);font-size:19px;display:flex;align-items:center;gap:8px}
.pcard h3 .tagx{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.stats{display:flex;gap:10px;margin:8px 0;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:4px;background:#0003;border-radius:6px;padding:4px 8px;font-family:var(--ff-ui);font-size:17px}
.stat .ic{width:18px;height:18px}
.stat.money{color:#7fe08a}.stat.not{color:#ff8f7a}.stat.inc{color:#cfd6e2}
.cubes{display:flex;gap:2px}.cube{width:9px;height:9px;border-radius:2px;background:#4caf50}.cube.r{background:var(--red)}
.rowlbl{font-family:var(--ff-ui);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:8px 0 4px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.slots.six{grid-template-columns:repeat(6,1fr)}
.slot{aspect-ratio:1/1.1;border-radius:6px;background:#00000040;border:1px dashed #ffffff22;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;text-align:center;line-height:1.05;position:relative;padding:2px;overflow:hidden;color:var(--text)}
.slot .ic{width:22px;height:22px}
.slot.asset{background:#3b2f4e;border:1px solid #6f58a0}.slot.asset.locked{background:repeating-linear-gradient(45deg,#2a2533 0 5px,#231f2b 5px 10px);color:#9b8fb6}
.slot.equip{background:#2a3d52;border:1px solid #47678a}.slot.fixer{background:#4a3a1e;border:1px solid #8f7034}.slot.bag{background:#2d4a2c;border:1px solid #4f8a4c}
.slot.contact{background:var(--paper);color:var(--ink);border:1px solid #fff}
.slot.used{filter:grayscale(.9) brightness(.55)}
.slot .cost{position:absolute;top:2px;left:3px;font-family:var(--ff-ui);font-weight:700;font-size:11px}
.slot .star{position:absolute;top:2px;right:2px;color:var(--red);width:12px;height:12px}
.slot.cuffed::after{content:'⛓';position:absolute;inset:0;display:grid;place-items:center;font-size:24px;background:#000a}
.slot .lbl{margin-top:2px;font-family:var(--ff-ui);font-size:11px;line-height:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:#0003;border-radius:20px;padding:3px 9px;font-size:13px}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}
.plan div{background:var(--paper);color:var(--ink);border-radius:4px;padding:3px 4px;font-size:11.5px;display:flex;justify-content:space-between;align-items:center;font-family:var(--ff-ui)}
.plan div.v{background:#9bd08f}.plan div.inc{background:#f7e08a}
.plan div b{font-size:13px}
.ccard{width:74px;height:104px;border-radius:7px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:4px;position:relative;font-family:var(--ff-ui);box-shadow:0 2px 6px #0008;flex:none;cursor:default;transition:transform .15s}
.ccard .nm{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;text-align:center;line-height:1}
.ccard .art{flex:1;display:grid;place-items:center;width:100%;border-radius:4px;margin:3px 0;background:linear-gradient(135deg,#2a3346,#3d2a3e);color:#f1e7d0}
.ccard .art .ic{width:32px;height:32px}
.ccard .ft{display:flex;justify-content:space-between;width:100%;font-size:13px;font-weight:700}
.ccard .st{color:var(--red)}
.ccard .step{font-size:10px;opacity:.7}
.ccard.pick{cursor:pointer}.ccard.pick:hover{transform:translateY(-4px)}
.ccard.sel{outline:3px solid var(--mustard);transform:translateY(-6px)}
.cardrow{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 8px}
.kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #ffffff14;font-size:14px}
.biz{display:flex;align-items:center;gap:6px;padding:4px 0}.biz .ic{width:20px;height:20px}
.mini-cubes{display:flex;gap:2px;margin-left:auto}.mini-cubes i{width:10px;height:10px;border-radius:2px}
.track{display:flex;flex-direction:column-reverse;gap:2px}
.trow{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px;border-radius:4px;background:#0002;position:relative}
.trow.th{border-top:2px solid var(--red)}
.trow .lv{width:16px;font-family:var(--ff-ui);color:var(--muted)}
.trow .pen{margin-left:auto;font-size:12px;color:#ff9a8a}
.log{font-size:13.5px;line-height:1.35}
.log div{padding:3px 0;border-bottom:1px dotted #ffffff12}
.log .turnline{color:var(--mustard);font-family:var(--ff-ui);font-size:14px;margin-top:6px}
.log .phase{color:#8fc7ff;font-family:var(--ff-ui)}
/* ---------- sheets / modals ---------- */
#sheet{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(680px,calc(100% - 16px));max-height:60%;overflow:auto;padding:14px 16px;z-index:8;animation:sheetin .25s}
@keyframes sheetin{from{transform:translate(-50%,30px);opacity:0}}
#sheet h3{margin:0 0 4px;font-family:var(--ff-type);font-size:21px}
#sheet .sub{color:var(--ink2);font-size:14px;margin-bottom:10px}
#sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
#sheet button{background:var(--ink);color:var(--paper)}
#sheet button.pri{background:var(--red);color:#fff}
#sheet button.ghost{background:transparent;color:var(--ink);border:1px solid #0003}
.choice{display:flex;align-items:center;gap:8px;background:#fff8;border:1px solid #0002;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);text-align:left;font-family:var(--ff-body);font-size:14px}
.choice:hover{background:#fff}
.choice .ic{width:24px;height:24px}
.choice b{font-family:var(--ff-ui);font-size:16px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.off-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #0002;flex-wrap:wrap}
.off-row .who{min-width:120px;font-family:var(--ff-ui);font-size:16px}
.off-row .done{color:#2b8a3e;font-weight:700}
.opt-btn{font-size:13px;padding:6px 9px}
.planlist{display:flex;flex-direction:column;gap:6px}
.planlist .choice{justify-content:space-between}
.pop{position:absolute;z-index:9;min-width:230px;max-width:300px;padding:10px 12px}
.tip{position:fixed;z-index:50;max-width:280px;background:#0b0d12f2;color:#eee;border:1px solid #ffffff22;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.35;pointer-events:none;box-shadow:0 8px 20px #000a}
.tip b{color:var(--mustard);font-family:var(--ff-ui);font-size:15px;display:block;margin-bottom:2px}
/* ---------- effects ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.float{position:absolute;font-family:var(--ff-ui);font-weight:700;font-size:22px;text-shadow:0 2px 0 #000,0 0 8px #000;white-space:nowrap;animation:floatup calc(1.3s*var(--speed)) ease-out forwards}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--ff-type);font-size:clamp(34px,7vw,72px);color:var(--paper);text-shadow:3px 3px 0 var(--red),0 0 30px #000;animation:banner calc(1.4s*var(--speed)) ease-in-out forwards}
.banner small{display:block;font-family:var(--ff-ui);font-size:.32em;letter-spacing:.4em;color:var(--mustard);text-transform:uppercase;text-shadow:0 2px 0 #000}
@keyframes banner{0%{opacity:0;transform:translateX(-30%) skewX(-10deg)}18%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(30%) skewX(10deg)}}
.flycard{position:absolute;transition:all calc(.7s*var(--speed)) cubic-bezier(.5,-.2,.4,1.3)}
.flash{animation:flash calc(.9s*var(--speed))}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px var(--mustard),0 0 30px var(--mustard)}}
.flashred{animation:flashred calc(.9s*var(--speed))}
@keyframes flashred{0%,100%{background:inherit}30%{background:#7a1b16}}
@keyframes pulse{50%{transform:rotate(-1.5deg) scale(1.08)}}
.stamp{position:absolute;font-family:var(--ff-type);font-size:64px;color:var(--red);border:6px solid var(--red);padding:4px 20px;border-radius:10px;transform:rotate(-12deg);animation:stamp calc(1.3s*var(--speed)) forwards;background:#0006}
@keyframes stamp{0%{transform:rotate(-12deg) scale(3);opacity:0}20%{transform:rotate(-12deg) scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
/* rules */
#rules{position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px}
#rules .box{width:min(900px,100%);height:min(720px,100%);display:grid;grid-template-columns:240px 1fr;overflow:hidden;padding:0}
#rules nav{background:#00000010;border-right:1px solid #0002;overflow:auto;padding:10px}
#rules nav input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #0003;font-size:15px;margin-bottom:8px;background:#fff}
#rules nav button{display:flex;gap:6px;width:100%;text-align:left;background:transparent;color:var(--ink);padding:7px 8px;font-size:15px}
#rules nav button.on{background:var(--ink);color:var(--paper)}
#rules article{overflow:auto;padding:16px 22px;font-size:15.5px;line-height:1.5}
#rules article h2{font-family:var(--ff-type);margin:0 0 8px;font-size:26px}
#rules article .lt{padding:1px 7px;border-radius:4px;color:#fff;font-size:13px}.lt.I{background:var(--I)}.lt.C{background:#a99668}.lt.R{background:var(--R)}.lt.W{background:var(--W)}
.pc.county{color:#2378c0}.pc.federal{color:var(--red)}.pc.swat{color:#111}
.grp.purple{color:#7a35b0;font-weight:600}.grp.blue{color:#2563b0;font-weight:600}
#rules .close{position:absolute;top:10px;right:12px}
#rules .res{border-bottom:1px dashed #0002;padding:8px 0;cursor:pointer}
#rules .res b{font-family:var(--ff-ui);font-size:17px}
@media (max-width:700px){#rules .box{grid-template-columns:1fr;grid-template-rows:auto 1fr}#rules nav{max-height:180px}}
/* end */
.scoretbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.scoretbl th,.scoretbl td{padding:5px 6px;border-bottom:1px solid #0001;text-align:right}
.scoretbl th:first-child,.scoretbl td:first-child{text-align:left}
.scoretbl tr.tot td{font-weight:700;font-size:16px;border-top:2px solid var(--ink)}
.scoretbl .win{background:#f6d64a66}
.hextile{display:inline-block;cursor:pointer;border-radius:8px;padding:3px;transition:transform .15s}
.hextile:hover{transform:translateY(-3px)}.hextile.sel{background:var(--mustard)}
</style>

/* Heist — rules engine (base game). Pure state machine.
   state.pending describes the decision needed; E.act(state, action) applies it.
   state.events collects animation/narration events (UI drains them). */
(function (root) {
'use strict';
let D = null;
const E = {};
E.init = (data) => { D = data; E._D = data; prep(); };

// ---------- RNG ----------
function rnd(s) { // mulberry32 on state.rng
  s.rng = (s.rng + 0x6D2B79F5) | 0; let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function shuffle(s, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clone = (o) => JSON.parse(JSON.stringify(o));

// ---------- static data ----------
const COLORS = ['orange', 'purple', 'pink', 'yellow', 'green'];
const PTYPES = ['county', 'federal', 'swat'];
const PLAN_KEYS = ['casino', 'bar', 'restaurant', 'gym', 'nightclub', 'gallery', 'sh1', 'sh2', 'sh3'];
const GROUPS = { purple: ['casino', 'bar', 'restaurant'], blue: ['gym', 'nightclub', 'gallery'] };
const CONTACT_SCORE = [0, 0, 10, 30, 60, 100];
const UNLOCK_COSTS = [5, 4, 3, 2, 1, 1];
// 18-cell board, flat-top, odd-q (odd columns shifted down)
const CELLS = []; (() => { for (let c = 0; c < 5; c++) { const rows = c % 2 ? 3 : 4; for (let r = 0; r < rows; r++) CELLS.push({ c, r }); } })();
const START_CELLS = [CELLS.findIndex(x => x.c === 2 && x.r === 1), CELLS.findIndex(x => x.c === 2 && x.r === 2)];
const DIRS = [[0, -1], [1, -1], [1, 0], [0, 1], [-1, 1], [-1, 0]]; // axial dq,dr for edges N,NE,SE,S,SW,NW
function axial(i) { const { c, r } = CELLS[i]; return { q: c, r: r - (c - (c & 1)) / 2 }; }
function cellAt(q, r) { const c = q; if (c < 0 || c > 4) return -1; const row = r + (c - (c & 1)) / 2; return CELLS.findIndex(x => x.c === c && x.r === row); }
function nb(i, e) { const a = axial(i); return cellAt(a.q + DIRS[e][0], a.r + DIRS[e][1]); }
function hexDist(i, j) { const a = axial(i), b = axial(j); return (Math.abs(a.q - b.q) + Math.abs(a.r - b.r) + Math.abs(a.q + a.r - b.q - b.r)) / 2; }
E.CELLS = CELLS; E.axial = axial; E.hexDist = hexDist; E.nb = nb; E.COLORS = COLORS; E.PTYPES = PTYPES;
E.PLAN_KEYS = PLAN_KEYS; E.GROUPS = GROUPS; E.CONTACT_SCORE = CONTACT_SCORE; E.UNLOCK_COSTS = UNLOCK_COSTS;

let TILE = {}, CONTACT = {}, FIXER = {}, EQUIP = {}, ASSET = {};
function prep() {
  TILE = {}; D.tiles.tiles.forEach(t => TILE[t.id] = t);
  CONTACT = {}; D.contacts.cards.forEach(c => CONTACT[c.id] = c);
  FIXER = {}; D.fixers.fixers.forEach(f => FIXER[f.id] = f);
  EQUIP = {}; D.equipment.equipment.forEach(f => EQUIP[f.id] = f);
  ASSET = {}; D.assets.assets.forEach(a => ASSET[a.id] = a);
  E.TILE = TILE; E.CONTACT = CONTACT; E.FIXER = FIXER; E.EQUIP = EQUIP; E.ASSET = ASSET;
}
// half-edge land of placed tile at absolute edge e, half h (0 = first clockwise)
function land(tileId, rot, e, h) { const t = TILE[tileId]; const oe = ((e - rot) % 6 + 6) % 6; return t.edges[oe * 2 + h]; }
E.land = land;

// ---------- config by player count ----------
function trackCfg(n) {
  return n >= 4 ? { max: 7, th: [3, 6, 7], pen: [0, 0, 10, 30, 40, 60, 80, 100], closeAt: 3 }
                : { max: 6, th: [3, 5, 6], pen: [0, 0, 10, 30, 50, 80, 100], closeAt: 2 };
}
E.trackCfg = trackCfg;

// ---------- setup ----------
E.newGame = function (opts) {
  const s = { v: 1, rng: (opts.seed >>> 0) || ((Math.random() * 2 ** 31) | 0), events: [], log: [] };
  const n = opts.players.length; s.n = n; s.cfg = trackCfg(n);
  s.opts = { gasCan: opts.gasCan !== false, upgradeFixers: opts.upgradeFixers !== false };
  // city
  s.cells = CELLS.map(() => null); // {tile, rot, police:{county,federal,swat}}
  const starts = shuffle(s, ['S1', 'S2']); const srot = rnd(s) < 0.5 ? 0 : 3;
  starts.forEach((t, k) => { s.cells[START_CELLS[k]] = { tile: t, rot: srot, police: {} }; });
  s.stacks = {}; ['A', 'B', 'C', 'D'].forEach(L => { s.stacks[L] = shuffle(s, D.tiles.tiles.filter(t => t.stack === L).map(t => t.id)); });
  s.display = []; // {tile, police}
  // police bag
  s.bag = { county: 10, federal: 10, swat: 10 };
  s.patrol = shuffle(s, D.patrol.patrol.slice()); s.patrol.pop(); // one removed
  s.patrolSpaces = { 1: 0, 2: 0, 3: 0 };
  s.exitStacks = [shuffle(s, D.exits.stacks.black.slice()), shuffle(s, D.exits.stacks.grey.slice())];
  s.exitOn = {}; // exitNumber -> stack index (closed exits)
  s.pendingExitStack = {}; // exitNumber -> stack idx waiting for tile
  ['A', 'B', 'C', 'D'].forEach(L => { const d = revealStack(s, L); if (d) drawPolice(s, d.police, 2); });
  const s1cell = s.cells.findIndex(c => c && c.tile === 'S1');
  drawPolice(s, s.cells[s1cell].police, 2);
  // places
  s.bizSlots = {}; s.shSlots = {}; // slot loc id -> business/safehouse id
  s.bizCubes = {}; D.locations.businesses.forEach(b => s.bizCubes[b.id] = []);
  s.closed = {};
  s.shCubes = { sh1: [], sh2: [], sh3: [] };
  const keys = shuffle(s, ['green', 'green', 'green', 'black', 'black', 'black', 'brown', 'brown', 'brown']);
  s.shKeys = { sh1: keys.slice(0, 3), sh2: keys.slice(3, 6), sh3: keys.slice(6, 9) };
  s.fixers = D.fixers.fixers.filter(f => s.opts.upgradeFixers || !f.upgrade).map(f => f.id);
  s.equip = {}; D.equipment.equipment.forEach(e => s.equip[e.id] = e.count);
  s.gasSupply = 6;
  s.lockers = { green: shuffle(s, D.lockers.lockers.green.tiles.slice()), black: shuffle(s, D.lockers.lockers.black.tiles.slice()), brown: shuffle(s, D.lockers.lockers.brown.tiles.slice()) };
  s.deck = shuffle(s, D.contacts.cards.filter(c => s.opts.gasCan || !c.upgrade).map(c => c.id));
  s.cdisplay = s.deck.splice(0, 7);
  s.discs = 8;
  s.gangs = {}; // gang loc id -> {members, ctrl: pid|null}
  const s1 = TILE.S1; const g1 = s1.locs.find(l => l.type === 'gang').id; s.gangs[g1] = { members: 2, ctrl: null };
  s.gangPool = 6;
  // players
  const plans = shuffle(s, D.escapePlans.cards.map((c, i) => i));
  const order = opts.players.map((p, i) => i);
  s.players = opts.players.map((p, i) => ({
    id: i, color: p.color || COLORS[i], name: p.name || ('P' + (i + 1)), ai: !!p.ai, level: p.level || 'normal',
    money: 9, income: 9, notor: 1, red: 0, blue: 0, loc: 'hospital', plan: plans[i],
    items: [null, null, { kind: 'asset', id: 'move_county', locked: true }, { kind: 'asset', id: 'move_federal', locked: true }, { kind: 'asset', id: 'move_swat', locked: true }],
    contacts: [null, null, { kind: 'asset', id: 'avoid_tile', locked: true }, { kind: 'asset', id: 'master_key', locked: true }, { kind: 'asset', id: 'heal', locked: true }],
    cuffs: 0, unlocked: [{ id: 'extra_action', used: false }, null, null, null, null, null],
    gas: 0, gangMembers: [], ctrlFree: 2, firstAid: true, rest: true, wounds: 0, discs: 0,
    keys: {}, visited: {}, bonus: {}, escaped: false, arrested: false, escapeOrder: 0, stash: [],
    power: p.power || null, mission: null, discDay: {}, keepFaceUp: true
  }));
  if (opts.missions) { const ms = shuffle(s, D.missions.missions.map(m => m.id)); s.players.forEach((p, i) => { p.mission = { id: ms[i % ms.length], done: false, ability: null, token: true }; }); }
  s.players.forEach(p => {
    if (p.power === 'bones' && s.gasSupply > 0) { p.gas = 1; s.gasSupply--; }
    if (p.power === 'kitty') { p.money -= 3; const g1k = TILE.S1.locs.find(l => l.type === 'gang').id; s.gangs[g1k] = { members: 0, ctrl: p.id }; p.gangMembers = [g1k, g1k]; p.ctrlFree = 1; }
  });
  s.npcs = [];
  const used = new Set(s.players.map(p => p.color)); const freeCol = () => { const c = COLORS.find(x => !used.has(x)); used.add(c); return c; };
  const mkNpc = (id, kind, name) => ({ id, npc: kind, name, color: freeCol(), loc: 'hospital', notor: 1, red: 0, blue: 0, discs: 0, visited: {}, bonus: {}, escaped: false, arrested: false, wounds: 0, contacts: [], stacks: [], debt: 0, escapeOrder: 0 });
  if (n <= 2) { const sd = mkNpc(100, 'sandra', 'Sandra'); sd.deck = shuffle(s, D.inspector.cards.map((c, i) => i)); s.npcs.push(sd); }
  if (n === 1) { const co = mkNpc(101, 'costa', 'Lt. Costa'); co.deck = shuffle(s, D.lieutenant.cards.map((c, i) => i)); co.plan = plans[1]; co.easy = !!opts.easyCosta; s.npcs.push(co); }
  if (n === 2) order.push(100);
  if (n === 1) order.push(101, 100);
  s.order = order; // turn order (pids)
  s.day = 1; s.part = 0; s.escapes = 0;
  s.queue = [{ k: 'dayStart' }];
  s.pending = null;
  ev(s, { t: 'setup' });
  run(s);
  return s;
};

// ---------- helpers ----------
function ev(s, e) { s.events.push(e); s.log.push(e); if (s.log.length > 4000) s.log.splice(0, 500); }
function P(s, i) { return i >= 100 ? s.npcs.find(x => x.id === i) : s.players[i]; }
E.P = P;
function everyone(s) { return s.players.concat(s.npcs); }
function posCell(s, pos) { if (pos == null) return -1; return pos.indexOf(':') >= 0 ? +pos.split(':')[0] : locCell(s, pos); }
E.posCell = posCell;
function active(s) { return s.players.filter(p => !p.escaped && !p.arrested); }
function drawPolice(s, pol, k) {
  for (let i = 0; i < k; i++) {
    const tot = s.bag.county + s.bag.federal + s.bag.swat; if (!tot) return;
    let x = rnd(s) * tot, t = 'county'; for (const ty of PTYPES) { if (x < s.bag[ty]) { t = ty; break; } x -= s.bag[ty]; }
    s.bag[t]--; if (pol[t]) s.bag[t]++; else pol[t] = true;
  }
}
function revealStack(s, L) {
  if (!s.stacks[L].length) return;
  const t = s.stacks[L].shift(); const d = { tile: t, police: {}, stack: L }; s.display.push(d);
  // pending exit stacks on newly visible exits
  TILE[t].locs.forEach(l => { if (l.type === 'exit') { const n = +l.id.slice(4); if (s.pendingExitStack[n] != null) { s.exitOn[n] = s.pendingExitStack[n]; delete s.pendingExitStack[n]; } } });

{ id: 'movement', icon: '👣', kw: 'movement mp land type industrial commercial residential water ferry subway metro heliport helipad gas cost movimento terreno água ferry gasolina',
  title: { en: 'Movement', pt: 'Movimento' },
  body: { en: `<p>Each movement point (MP) lets you: <b>leave</b> a location onto the land, <b>enter</b> a location from the land, or <b>cross</b> into a different land type. Moving across tiles of the <b>same</b> land type is free.</p><p>Land types: <span class="lt I">Industrial</span> <span class="lt C">Commercial</span> <span class="lt R">Residential</span> <span class="lt W">Water</span>. You can only cross water if that body of water has a <b>ferry</b> (F icon) — or with a Jet Ski.</p><p>You can't pass through locations and must stop at a <b>different</b> location.</p><ul><li><b>Subway</b>: when you enter one, jump to any other subway for free and gain +1 MP.</li><li><b>Heliport</b>: spend 1 MP to fly to any place on a tile 1–2 tiles away.</li><li><b>Helipad</b> (H corners): the whole tile counts as a helipad for helicopter abilities.</li><li><b>Gas Cans</b>: each one gives +1 MP when spent.</li></ul><p>The game shows every place you can reach and picks the path with the fewest police.</p>`,
         pt: `<p>Cada ponto de movimento serve para: <b>sair</b> de um local para o terreno, <b>entrar</b> num local a partir do terreno, ou <b>passar</b> para um tipo de terreno diferente. Andar por peças com o <b>mesmo</b> terreno é grátis.</p><p>Terrenos: <span class="lt I">Industrial</span> <span class="lt C">Comercial</span> <span class="lt R">Residencial</span> <span class="lt W">Água</span>. Só se atravessa água se essa zona de água tiver <b>ferry</b> (ícone F) — ou com um Jet Ski.</p><p>Não podes atravessar locais e tens de parar num local <b>diferente</b> do inicial.</p><ul><li><b>Metro</b>: ao entrar, saltas para outro metro de graça e ganhas +1 movimento.</li><li><b>Heliporto</b>: gastas 1 movimento para voar para qualquer sítio numa peça a 1–2 de distância.</li><li><b>Helipad</b> (cantos com H): a peça inteira conta como heliporto para as habilidades de helicóptero.</li><li><b>Latas de gasolina</b>: cada uma dá +1 movimento.</li></ul><p>O jogo mostra todos os sítios onde podes chegar e escolhe o caminho com menos polícia.</p>` } },
{ id: 'police', icon: '👮', kw: 'police officer avoid wound handcuffs county federal swat polícia evitar ferimento algemas',
  title: { en: 'Police, wounds & handcuffs', pt: 'Polícia, ferimentos e algemas' },
  body: { en: `<p>There are 3 kinds of officers: <b class="pc county">County</b> (blue), <b class="pc federal">Federal</b> (red) and <b class="pc swat">SWAT</b> (black). A tile never has two of the same kind, and the Hospital tile has none.</p><p>After travelling you must <b>avoid</b> each officer on the tiles you left (the start tile and any tile you walked through; not the tile you stop on). Moving between two locations on the same tile needs no avoiding. Subway and helicopters skip the tiles in between.</p><p>To avoid you use <b>Equipment</b> (Helmet = SWAT, Vest = Federal, Hat = County, Gas Mask = SWAT or County), Contact cards, Fixers, Assets or a gang biker. Every officer you don't avoid gives you a <b>Wound</b> (−$20k at the end).</p><p>With all 3 wound cubes red, another wound gives you <b>Handcuffs</b>: they block your rightmost free Contact space, and one wound cube goes back to green.</p>`,
         pt: `<p>Há 3 tipos de polícia: <b class="pc county">County</b> (azul), <b class="pc federal">Federal</b> (vermelho) e <b class="pc swat">SWAT</b> (preto). Uma peça nunca tem dois do mesmo tipo, e a peça do Hospital nunca tem polícia.</p><p>Depois de viajar tens de <b>evitar</b> cada polícia das peças que deixaste (a peça de partida e as peças por onde passaste; não a peça onde paras). Mudar entre dois locais da mesma peça não obriga a evitar. O metro e os helicópteros saltam as peças pelo meio.</p><p>Para evitar usas <b>equipamento</b> (Capacete = SWAT, Colete = Federal, Boné = County, Máscara de gás = SWAT ou County), cartas de Contacto, Fixers, ativos ou um motard do gang. Cada polícia que não evitares dá-te um <b>ferimento</b> (−$20k no fim).</p><p>Com os 3 cubos de ferimento no vermelho, um novo ferimento dá-te <b>algemas</b>: bloqueiam o teu espaço de Contacto livre mais à direita, e um cubo volta ao verde.</p>` } },
{ id: 'notoriety', icon: '⭐', kw: 'notoriety cubes threshold line unlock police move penalty notoriedade cubos linha limiar penalização',
  title: { en: 'Notoriety', pt: 'Notoriedade' },
  body: { en: `<p>During your turn, gains and losses are tracked with your 4 notoriety cubes (red = up, blue = down). At the end of each part of the day everybody's marker moves, in turn order.</p><p>You <b>gain</b>: visiting a location where other players are (+1 each), Hospital (+1), cards with a red star, replacing a card or tile. You <b>lose</b>: Safe Houses, Church ($1k), Informer/Disguise, gang bikers, completing a business group.</p><p><b>Crossing a red line upwards</b>: every player with less notoriety moves one officer at least 1 tile closer to you, then you unlock assets (line 1: 1 asset, line 2: 2 assets, line 3: 1 asset + an Extra Action).</p><p>High notoriety plays first and helps open lockers, but costs money at the end (up to −$100k).</p>`,
         pt: `<p>Durante o teu turno, os ganhos e perdas contam-se com os teus 4 cubos de notoriedade (vermelho = sobe, azul = desce). No fim de cada parte do dia, o marcador de todos move-se, por ordem de turno.</p><p><b>Ganhas</b>: ao visitar um local onde estão outros jogadores (+1 por cada), no Hospital (+1), com cartas de estrela vermelha, ao substituir uma carta ou peça. <b>Perdes</b>: nas Casas Seguras, na Igreja ($1k), com Informer/Disfarce, com motards do gang, ao completar um grupo de Business.</p><p><b>Ao passar uma linha vermelha a subir</b>: todos os jogadores com menos notoriedade movem um polícia pelo menos 1 peça mais perto de ti; depois desbloqueias ativos (linha 1: 1 ativo, linha 2: 2 ativos, linha 3: 1 ativo + uma Ação Extra).</p><p>Notoriedade alta joga primeiro e ajuda a abrir cacifos, mas custa dinheiro no fim (até −$100k).</p>` } },
{ id: 'business', icon: '🎰', kw: 'business casino bar restaurant gym nightclub gallery escape plan income cube close key business casino bar restaurante ginásio discoteca galeria plano rendimento fechar chave',
  title: { en: 'Businesses', pt: 'Businesses' },
  body: { en: `<p>Six businesses in two groups: <span class="grp purple">Casino, Bar, Restaurant</span> and <span class="grp blue">Gym, Nightclub, Art Gallery</span>. You may visit each one <b>once</b>.</p><ol><li>+1 notoriety per other player there.</li><li>Take the top cube from your income track (your income drops by 1). Check your <b>Escape Plan</b>: if it shows money, you score it at the end; if it shows <b>$</b>, receive income now.</li><li>Take a Contact card.</li></ol><p>A business <b>closes</b> after 2 visits (1–3 players) or 3 visits (4–5 players). To enter a closed one you need a key (any colour) or the Master Key asset.</p><p>Visiting a whole group gives a bonus: an Extra Action, or unlock an asset and lose 1 notoriety.</p>`,
         pt: `<p>Seis Businesses em dois grupos: <span class="grp purple">Casino, Bar, Restaurante</span> e <span class="grp blue">Ginásio, Discoteca, Galeria de Arte</span>. Cada um só pode ser visitado <b>uma vez</b> por ti.</p><ol><li>+1 de notoriedade por cada outro jogador lá.</li><li>Tiras o cubo de cima do teu trilho de rendimento (o rendimento desce 1). Vês o teu <b>Plano de Fuga</b>: se mostra dinheiro, pontuas no fim; se mostra <b>$</b>, recebes rendimento já.</li><li>Tiras uma carta de Contacto.</li></ol><p>Um Business <b>fecha</b> ao fim de 2 visitas (1–3 jogadores) ou 3 visitas (4–5 jogadores). Para entrar num fechado precisas de uma chave (qualquer cor) ou do ativo Chave Mestra.</p><p>Visitar um grupo inteiro dá um bónus: uma Ação Extra, ou desbloquear um ativo e perder 1 de notoriedade.</p>` } },
{ id: 'safehouse', icon: '🏠', kw: 'safe house key fixer casa segura chave fixer',
  title: { en: 'Safe Houses & Fixers', pt: 'Casas Seguras e Fixers' },
  body: { en: `<p>Three Safe Houses, each visited <b>once</b>:</p><ol><li>+1 notoriety per other player there.</li><li>Take your top income cube and check your Escape Plan (money at the end, or income now).</li><li>Lose 1 notoriety.</li><li>Take one of the keys left there (green, black or brown).</li><li>You may buy a <b>Fixer</b>: a one-use helper (Telephone, Safe, Disguise, ID Card, First Aid Kit, Motorcycle, Energy Drink, Helicopter…). It goes in an empty item space.</li></ol><p>Visiting all three gives a bonus: an Extra Action, or unlock an asset and receive income.</p>`,
         pt: `<p>Três Casas Seguras, cada uma visitada <b>uma vez</b>:</p><ol><li>+1 de notoriedade por cada outro jogador lá.</li><li>Tiras o cubo de cima do rendimento e vês o Plano de Fuga (dinheiro no fim, ou rendimento já).</li><li>Perdes 1 de notoriedade.</li><li>Tiras uma das chaves que lá estão (verde, preta ou castanha).</li><li>Podes comprar um <b>Fixer</b>: um ajudante de uso único (Telefone, Cofre, Disfarce, Cartão de Identidade, Kit de Primeiros Socorros, Mota, Bebida Energética, Helicóptero…). Vai para um espaço de item vazio.</li></ol><p>Visitar as três dá um bónus: uma Ação Extra, ou desbloquear um ativo e receber rendimento.</p>` } },
{ id: 'store', icon: '🛒', kw: 'store convenience equipment gas locker key loja equipamento gasolina cacifo chave',
  title: { en: 'Stores & lockers', pt: 'Lojas e cacifos' },
  body: { en: `<p>At a store (A, B, C or D):</p><ol><li>+1 notoriety per other player there.</li><li>Take a Gas Can (max 2).</li><li>Buy up to 2 different pieces of equipment (Gas Mask $3k, others $2k).</li><li>Open <b>one locker</b> if you have the key of its colour (or the Master Key) and your <b>notoriety + Contact cards</b> reaches the locker's number: green 1+, black 5+, brown 8+.</li></ol><p>You draw tiles from that locker (green: cards+1, black: cards, brown: cards−1), keep one secretly and put it in an item space.</p><p>Lockers: green $0/60/60/60/90k, black $0/70/70/100/100k, brown $0/80/110/110/110k.</p>`,
         pt: `<p>Numa loja (A, B, C ou D):</p><ol><li>+1 de notoriedade por cada outro jogador lá.</li><li>Levas uma lata de gasolina (máximo 2).</li><li>Compras até 2 equipamentos diferentes (Máscara de gás $3k, os outros $2k).</li><li>Abres <b>um cacifo</b> se tiveres a chave dessa cor (ou a Chave Mestra) e a tua <b>notoriedade + cartas de Contacto</b> chegar ao número do cacifo: verde 1+, preto 5+, castanho 8+.</li></ol><p>Tiras peças desse cacifo (verde: cartas+1, preto: cartas, castanho: cartas−1), guardas uma em segredo num espaço de item.</p><p>Cacifos: verde $0/60/60/60/90k, preto $0/70/70/100/100k, castanho $0/80/110/110/110k.</p>` } },
{ id: 'others', icon: '✚', kw: 'hospital clinic church gang heal unlock hospital clínica igreja gang curar desbloquear',
  title: { en: 'Hospital, Clinic, Church & Gangs', pt: 'Hospital, Clínica, Igreja e Gangs' },
  body: { en: `<ul><li><b>Hospital</b>: pay $1k/$3k/$6k to heal 1/2/3 wounds, then +1 notoriety (doctors report bullet wounds). Everyone starts here. No police on its tile.</li><li><b>Clinic</b>: +1 per other player; may unlock an asset; may heal 1 wound; take a Contact card.</li><li><b>Church</b>: +1 per other player; may pay $1k to lose 1 notoriety; may unlock an asset; take a Contact card.</li><li><b>Gang HQ</b>: only if nobody is there and nobody controls it. Pay $5k, take both bikers and put your control marker there. Each biker, when sent back, gives one ability: lose 1 notoriety, fly from a helipad tile up to 2 tiles, or ignore all police on one tile. When both are back, the gang is free again.</li></ul>`,
         pt: `<ul><li><b>Hospital</b>: pagas $1k/$3k/$6k para curar 1/2/3 ferimentos e depois +1 de notoriedade (os médicos reportam ferimentos de bala). Todos começam aqui. A peça nunca tem polícia.</li><li><b>Clínica</b>: +1 por cada outro jogador; podes desbloquear um ativo; podes curar 1 ferimento; tiras uma carta de Contacto.</li><li><b>Igreja</b>: +1 por cada outro jogador; podes pagar $1k para perder 1 de notoriedade; podes desbloquear um ativo; tiras uma carta de Contacto.</li><li><b>Sede do Gang</b>: só se não estiver lá ninguém e ninguém a controlar. Pagas $5k, levas os dois motards e pões lá o teu marcador. Cada motard, quando o devolves, dá uma habilidade: perder 1 de notoriedade, voar de uma peça com helipad até 2 peças, ou ignorar toda a polícia de uma peça. Quando os dois voltam, o gang fica livre.</li></ul>` } },
{ id: 'exits', icon: '🚪', kw: 'exit open closed patrol exit tile escape cost late fee saída aberta fechada patrulha fugir custo',
  title: { en: 'Exits & escaping', pt: 'Saídas e fuga' },
  body: { en: `<p>Patrol cards close exits: an exit with <b>2 patrol cards is closed</b>. One card was removed at setup, so on Day 3 exactly one exit stays open.</p><p><b>Visiting an exit</b>: +1 per other player; if open, you may receive income; if closed, receive income <i>or</i> draw Exit tiles (one per Contact card) and keep one; then take a Contact card.</p><p><b>Escaping</b> (Day 3 only): travel to the open exit and choose to escape (or escape at the start of your turn if you're already there). Avoid the police — including those on the exit tile — then pay: the first player out pays nothing, then see the Exit Cost card (e.g. 4 players: 0/5/10/10k). If you can't pay you're arrested.</p><p>After the first escape, everyone else pays <b>$1k before each turn</b> or is arrested.</p>`,
         pt: `<p>As cartas de patrulha fecham saídas: uma saída com <b>2 cartas está fechada</b>. Na preparação tirou-se uma carta, por isso no Dia 3 fica exatamente uma saída aberta.</p><p><b>Visitar uma saída</b>: +1 por cada outro jogador; se estiver aberta, podes receber rendimento; se estiver fechada, recebes rendimento <i>ou</i> tiras peças de saída (uma por carta de Contacto) e guardas uma; depois tiras uma carta de Contacto.</p><p><b>Fugir</b> (só no Dia 3): viaja até à saída aberta e escolhe fugir (ou foge no início do teu turno se já lá estiveres). Evitas a polícia — incluindo a da peça da saída — e pagas: o primeiro a sair não paga, depois vê-se a carta de custo de saída (ex.: 4 jogadores: 0/5/10/10k). Se não puderes pagar, és preso.</p><p>Depois da primeira fuga, todos os outros pagam <b>$1k antes de cada turno</b> ou são presos.</p>` } },
{ id: 'contacts', icon: '🃏', kw: 'contact card display take keep replace discard use star contacto carta mostra ficar substituir descartar estrela',
  title: { en: 'Contact cards', pt: 'Cartas de Contacto' },
  body: { en: `<p>When a location gives you a Contact, pick one of the 7 face-up cards and choose: <b>keep it</b> in your leftmost free space, <b>replace</b> one of yours (+1 notoriety), or <b>discard</b> it.</p><p>To use a card: pay its cost, gain 1 notoriety if it has a <b>red star</b>, apply the effect, then flip it (the back shows a star as a reminder). Resting or the Spy/Energy Drink flips them back.</p><p>The footprint icon means "use while travelling"; the shield icon means "use while avoiding". Cards also count for lockers, exit tiles and the end score (1–5 cards = 0/10/30/60/100k).</p>`,
         pt: `<p>Quando um local te dá um Contacto, escolhe uma das 7 cartas da mostra e decide: <b>ficar com ela</b> no teu espaço livre mais à esquerda, <b>substituir</b> uma das tuas (+1 de notoriedade), ou <b>descartá-la</b>.</p><p>Para usar uma carta: pagas o custo, ganhas 1 de notoriedade se tiver <b>estrela vermelha</b>, aplicas o efeito e viras a carta (o verso mostra uma estrela como lembrete). Descansar, o Spy ou a Bebida Energética voltam a virá-las.</p><p>O ícone de pegadas quer dizer "usar a viajar"; o de escudo quer dizer "usar a evitar a polícia". As cartas contam também para os cacifos, as peças de saída e a pontuação final (1–5 cartas = 0/10/30/60/100k).</p>` } },
{ id: 'assets', icon: '🔓', kw: 'asset unlock locked master key extra action ativo desbloquear chave mestra ação extra',
  title: { en: 'Assets & Extra Actions', pt: 'Ativos e Ações Extra' },
  body: { en: `<p>You have 7 Asset tiles. The Extra Action one starts unlocked; 3 others block item spaces and 3 block Contact spaces. <b>Unlocking</b> one moves it to the most expensive free asset space — freeing the space it occupied.</p><p>You unlock by: crossing notoriety lines, resting, paying $3k at income (notoriety 1–2), Clinic, Church, Spy 3, Gold Bars, group bonuses.</p><p>Each asset can be used <b>once</b>, paying the cost under its space. Used assets are worth <b>$10k</b> each at the end.</p><p><b>Extra Action discs</b> let you play at Night and Dawn. Get them from the Extra Action asset, ID Card, Fixer card, group bonuses and the third notoriety line.</p>`,
         pt: `<p>Tens 7 ativos. O de Ação Extra começa desbloqueado; 3 outros bloqueiam espaços de item e 3 bloqueiam espaços de Contacto. <b>Desbloquear</b> um passa-o para o espaço de ativo livre mais caro — e liberta o espaço onde estava.</p><p>Desbloqueias ao: passar linhas de notoriedade, descansar, pagar $3k no rendimento (notoriedade 1–2), Clínica, Igreja, Spy 3, Barras de Ouro, bónus de grupo.</p><p>Cada ativo usa-se <b>uma vez</b>, pagando o custo indicado por baixo do espaço. Ativos usados valem <b>$10k</b> cada no fim.</p><p>Os <b>discos de Ação Extra</b> deixam-te jogar à Noite e na Madrugada. Ganhas com o ativo de Ação Extra, o Cartão de Identidade, a carta Fixer, os bónus de grupo e a terceira linha de notoriedade.</p>` } },
{ id: 'scoring', icon: '💰', kw: 'score scoring end points tie winner pontuação fim pontos empate vencedor',
  title: { en: 'Final scoring', pt: 'Pontuação final' },
  body: { en: `<p>Only players who escaped can win. Discard 1 Contact card per Handcuffs card, then add:</p><ul><li>Money from visited Businesses and Safe Houses (Escape Plan values)</li><li>Cash in hand</li><li>$10k per used asset</li><li>Contact cards: 1/2/3/4/5 = 0/10/30/60/100k</li><li>Locker and Exit bags</li></ul><p>Subtract the notoriety penalty and $20k per red wound. Ties: most cash, then least notoriety, then fewest wounds.</p>`,
         pt: `<p>Só quem fugiu pode ganhar. Descarta-se 1 carta de Contacto por cada algema e soma-se:</p><ul><li>Dinheiro dos Businesses e Casas Seguras visitados (valores do Plano de Fuga)</li><li>Dinheiro na mão</li><li>$10k por cada ativo usado</li><li>Cartas de Contacto: 1/2/3/4/5 = 0/10/30/60/100k</li><li>Sacos dos cacifos e das saídas</li></ul><p>Subtrai-se a penalização de notoriedade e $20k por cada ferimento vermelho. Empates: mais dinheiro na mão, depois menos notoriedade, depois menos ferimentos.</p>` } },
{ id: 'twop', icon: '🕵️', kw: 'two players 2 sandra inspector dois jogadores inspetora',
  title: { en: '2 players: Inspector Sandra', pt: '2 jogadores: Inspetora Sandra' },
  body: { en: `<p>Sandra is a game-controlled third player. She gets no income and doesn't place tiles (each of you places 2). She counts as another player for crowding, and as a police officer <b>of any type</b> when you avoid (so any gear works on her; she can't be removed, only moved).</p><p>On her turn she reveals Inspector cards until one shows a location in the city (open exits are ignored on Days 1–2) and jumps there. Then: Businesses +1 notoriety, a cube (closing them faster) and she discards the 2 rightmost Contact cards; Safe Houses −1, discard a Fixer and a key; Stores ±1, discard 2 Contacts and a locker tile; closed exits −1, discard an Exit tile and 2 Contacts. She gets Extra Actions from discarded Fixer cards and completed groups, and uses them at night.</p><p>In this mode new Contact cards enter on the <b>left</b>, so the rightmost ones are the next to go.</p>`,
         pt: `<p>A Sandra é uma terceira jogadora controlada pelo jogo. Não recebe rendimento nem coloca peças (cada um de vós coloca 2). Conta como outro jogador para a notoriedade nos locais e como polícia <b>de qualquer tipo</b> quando evitas (qualquer equipamento serve contra ela; não pode ser retirada, só movida).</p><p>No turno dela revelam-se cartas de Inspetora até sair um local que esteja na cidade (as saídas abertas ignoram-se nos Dias 1–2) e ela salta para lá. Depois: Businesses +1 notoriedade, um cubo (fecham mais depressa) e descarta as 2 cartas de Contacto mais à direita; Casas Seguras −1, descarta um Fixer e uma chave; Lojas ±1, descarta 2 Contactos e uma peça de cacifo; saídas fechadas −1, descarta uma peça de saída e 2 Contactos. Ganha Ações Extra com cartas Fixer descartadas e grupos completos, e usa-as à noite.</p><p>Neste modo as cartas novas entram pela <b>esquerda</b>, por isso as da direita são as próximas a sair.</p>` } },
{ id: 'solo', icon: '👮‍♂️', kw: 'solo one player costa lieutenant bribe tenente subornar um jogador',
  title: { en: 'Solo: Lt. Costa', pt: 'Solo: Tenente Costa' },
  body: { en: `<p>Play with Sandra <b>and</b> Lt. Costa. You place all 4 tiles each day. Costa starts second in turn order, Sandra third, so on Day 1 they act before you.</p><p>Costa draws Lieutenant cards until one is on your tile or next to it (if none, he loses the turn). He <b>keeps</b> what Sandra would discard: the rightmost Contact card at Businesses, 2 tiles from lockers or closed exits (Store D: one of each colour, scoring only the best). He never visits closed Businesses and always escapes on Day 3.</p><p>He's corrupt: leaving a tile where Costa stands costs a <b>$3k bribe</b> (mandatory if you can pay), otherwise 2 wounds. Avoid-all abilities and move-officer abilities also work on him.</p><p>Costa scores his Escape Plan, Contacts and his stacks (both tiles; a $0 tile counts as the best of its kind), minus notoriety and any exit cost/fees. Beat his score to win. The <i>easy</i> option makes him take 1 tile instead of 2.</p>`,
         pt: `<p>Joga-se com a Sandra <b>e</b> o Tenente Costa. Colocas tu as 4 peças em cada dia. O Costa começa em 2.º na ordem de turno e a Sandra em 3.º, por isso no Dia 1 jogam antes de ti.</p><p>O Costa tira cartas de Tenente até sair um local na tua peça ou numa peça vizinha (se não houver, perde a vez). Ele <b>guarda</b> o que a Sandra descartaria: a carta de Contacto mais à direita nos Businesses, 2 peças dos cacifos ou das saídas fechadas (Loja D: uma de cada cor, só conta a melhor). Nunca visita Businesses fechados e foge sempre no Dia 3.</p><p>É corrupto: sair de uma peça onde está o Costa custa um <b>suborno de $3k</b> (obrigatório se puderes pagar); se não, levas 2 ferimentos. As habilidades de evitar toda a polícia e de mover polícias também funcionam com ele.</p><p>O Costa pontua o Plano de Fuga, os Contactos e as pilhas (as 2 peças; uma peça de $0 vale o máximo desse tipo), menos a notoriedade e o custo/taxas de saída. Tens de ter mais pontos do que ele. A opção <i>fácil</i> faz com que tire 1 peça em vez de 2.</p>` } },
{ id: 'upgrade', icon: '🎁', kw: 'upgrade pack powers missions gas can fixers poderes missões gas can',
  title: { en: 'Upgrade Pack', pt: 'Upgrade Pack' },
  body: { en: `<ul><li><b>Gas Can</b> Contact card: $0, +1 movement point.</li><li><b>3 extra Fixers</b>: Scuba (cross water), Skater (avoid 1 officer), Gold Bars (unlock an asset).</li><li><b>Player Powers</b>: each player gets a character with a permanent ability (free choice, random or by colour).</li><li><b>Missions</b>: a secret card with two goals; complete either to reveal it and pick 1 of 3 permanent abilities (marked with a cube). "Once per day" abilities use a Power token.</li></ul><p>The designer recommends not mixing Powers and Missions.</p>`,

  app.innerHTML = `<div class="screen"><div class="setup paper"><h2>${t('setupTitle')}</h2><div class="hint">${t('seatHint')}</div>${SEATS.map(seat).join('')}
   <div class="hint" style="margin-top:8px">${t('players')}: <b>${n}</b> ${modeNote ? ' · ' + modeNote : ''}</div>
   <div class="opts"><div class="opt"><label>${t('mode')}</label><div class="seg" id="oMode">${[['base', 'modeBase'], ['powers', 'modePowers'], ['missions', 'modeMissions'], ['both', 'modeBoth']].map(([v, k]) => `<button class="${st.mode === v ? 'on' : ''}" data-v="${v}">${t(k)}</button>`).join('')}</div>${st.mode === 'both' ? `<div class="hint" style="margin:4px 0 0">⚠ ${t('both')}</div>` : ''}</div>
   <div class="opt">${usePow ? `<label>${t('powerPick')}</label><div class="seg" id="oAssign">${[['free', 'pickFree'], ['random', 'pickRandom'], ['color', 'pickColor']].map(([v, k]) => `<button class="${st.assign === v ? 'on' : ''}" data-v="${v}">${t(k)}</button>`).join('')}</div>` : ''}</div>
   <div class="opt"><label>Upgrade Pack</label><div class="chk"><input type="checkbox" id="oGas" ${st.gas ? 'checked' : ''}><span>${t('upgradeGas')}</span></div><div class="chk"><input type="checkbox" id="oFix" ${st.fix ? 'checked' : ''}><span>${t('upgradeFix')}</span></div></div>
   <div class="opt">${n === 1 ? `<label>Solo</label><div class="chk"><input type="checkbox" id="oEasy" ${st.easy ? 'checked' : ''}><span>${t('easyCosta')}</span></div>` : ''}<label>${t('speed')}</label><div class="seg" id="oSpeed">${['slow', 'normal', 'fast'].map(v => `<button class="${G.prefs.speed === v ? 'on' : ''}" data-v="${v}">${t(v)}</button>`).join('')}</div></div></div>
   <div class="row" style="display:flex;gap:10px;justify-content:space-between"><button class="ghost" id="sBack" style="color:var(--ink);border-color:#0003">←</button><button class="pri" id="sGo" ${n < 1 || nh < 1 && n < 1 ? 'disabled' : ''}>${t('start')}</button></div></div></div>`;
  $$('.seg[data-c]').forEach(sg => $$('button', sg).forEach(b => b.onclick = () => { st.seats[sg.dataset.c] = b.dataset.v; showSetup(); }));
  $('#oGas').onchange = (e) => st.gas = e.target.checked; $('#oFix').onchange = (e) => st.fix = e.target.checked; $('#oEasy') && ($('#oEasy').onchange = (e) => st.easy = e.target.checked);
  $$('#oSpeed button').forEach(b => b.onclick = () => { G.prefs.speed = b.dataset.v; document.documentElement.style.setProperty('--speed', SPEEDS[G.prefs.speed]); savePrefs(); showSetup(); });
  $('#sBack').onclick = showMenu;
  $$('#oMode button').forEach(b => b.onclick = () => { st.mode = b.dataset.v; showSetup(); });
  $$('#oAssign button').forEach(b => b.onclick = () => { st.assign = b.dataset.v; showSetup(); });
  $$('select[data-pw]').forEach(sl => sl.onchange = () => { st.powers[sl.dataset.pw] = sl.value; });
  $('#sGo').onclick = () => {
    const players = SEATS.filter(c => st.seats[c] !== 'off').map(c => ({ color: c, name: t('colors.' + c) + (st.seats[c] === 'ai' ? ' 🤖' : ''), ai: st.seats[c] === 'ai' }));
    if (!players.length) return;
    if (usePow) {
      const COLORPOW = { purple: 'bones', orange: 'ruby', pink: 'vinnie', yellow: 'claws', green: 'scar' };
      const pool = POW.map(x => x.id).sort(() => Math.random() - .5);
      if (st.assign === 'color') players.forEach(p => p.power = COLORPOW[p.color]);
      else { if (st.assign === 'free') players.forEach(p => { const w = st.powers[p.color]; if (w && pool.includes(w)) { p.power = w; pool.splice(pool.indexOf(w), 1); } }); players.forEach(p => { if (!p.power) p.power = pool.shift(); }); }
    }
    G.S = E.newGame({ seed: (Math.random() * 2 ** 31) | 0, players, gasCan: st.gas, upgradeFixers: st.fix, easyCosta: st.easy, missions: st.mode === 'missions' || st.mode === 'both' });
    G.logLines = []; startScreen(true);
  };
}
function startScreen(fresh) {
  G.screen = 'game'; G.fitted = false; G.zoom = { k: 1, x: 0, y: 0 }; G.sel = {}; G.tab = 'me';
  const app = $('#app');
  app.innerHTML = `<div id="game"><div id="top"></div><div id="mapwrap"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div><div id="side"></div><div id="bar"><div id="ticker"></div><div id="prompt"></div></div></div>`;
  if (fresh) { G.VS = E.clone(G.S); G.VS.events = []; G.VS.cells = G.VS.cells.map(() => null); G.VS.display = []; G.VS.day = 1; G.VS.part = 0; }
  else { G.VS = E.clone(G.S); G.S.events = []; }
  // fresh: start tiles appear first
  if (fresh) { G.S.cells.forEach((c, i) => { if (c && (c.tile === 'S1' || c.tile === 'S2')) G.VS.cells[i] = E.clone(c); }); }
  bindPanZoom(); renderAll();
  window.onresize = () => { G.fitted = false; renderMap(); };
  loop();
}
function showEnd() {
  const S = G.S; const sc = S.score || E.score(S); const win = E.winners(S);
  const cats = ['g1', 'g2', 'sh', 'cash', 'assets', 'contacts', 'bags', 'notor', 'wounds'];
  const cols = sc.map(x => ({ x, name: x.npc ? t('costaScore') : pname(x.pid), col: x.npc ? '#2b3f6b' : pcolor(x.pid) }));
  const costa = sc.find(x => x.npc); const hum = sc.filter(x => !x.npc);
  let verdict = win.length ? `${t(win.length > 1 ? 'winners' : 'winner')}: ${win.map(id => id >= 100 ? t('costaScore') : pname(id)).join(', ')}` : t('arrested');
  if (costa && hum.length === 1) verdict = win.includes(hum[0].pid) ? t('beatCosta') : t('lostCosta');
  const d = document.createElement('div'); d.id = 'rules';
  d.innerHTML = `<div class="box paper" style="display:block;height:auto;max-height:95%;overflow:auto;padding:20px 22px;position:relative"><h2 style="font-family:var(--ff-type);margin:0">${t('gameOver')}</h2><div style="font-size:20px;margin:6px 0 10px;font-family:var(--ff-ui)">🏆 ${verdict}</div>
   <table class="scoretbl"><tr><th></th>${cols.map(c => `<th class="${win.includes(c.x.pid) ? 'win' : ''}"><span class="dot" style="background:${c.col}"></span> ${c.name}<br><small>${c.x.escaped ? '🚗 ' + t('escaped') : '🚨 ' + t('arrested')}</small></th>`).join('')}</tr>
   ${cats.map(k => `<tr><td>${t('score.' + k)}</td>${cols.map(c => `<td class="${win.includes(c.x.pid) ? 'win' : ''}">${c.x[k] ? (c.x[k] > 0 ? '' : '−') + '$' + Math.abs(c.x[k]) + 'k' : '—'}</td>`).join('')}</tr>`).join('')}
   <tr class="tot"><td>${t('total')}</td>${cols.map(c => `<td class="${win.includes(c.x.pid) ? 'win' : ''}">${c.x.escaped ? '$' + c.x.total + 'k' : '0'}</td>`).join('')}</tr></table>
   <div class="row" style="display:flex;gap:10px;margin-top:14px"><button class="pri" id="eAgain">${t('playAgain')}</button><button class="ghost" id="eMenu" style="color:var(--ink)">${t('menu')}</button><button class="ghost" id="eClose" style="color:var(--ink)">${t('close')}</button></div></div>`;
  document.body.appendChild(d);
  $('#eAgain').onclick = () => { d.remove(); showSetup(); }; $('#eMenu').onclick = () => { d.remove(); showMenu(); }; $('#eClose').onclick = () => d.remove();
}

// ---------------- boot ----------------
bindTips();
window.HeistUI = { G, E, T, startScreen, showMenu, human, loop, AI };
showMenu();
})();

</script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
