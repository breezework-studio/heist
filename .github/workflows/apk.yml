name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log
          cp android/app/build/outputs/apk/release/app-release.apk heist.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Heist Android ${{ github.run_number }}
          make_latest: true
          files: heist.apk
          body: Install heist.apk on Android (allow installing from unknown sources). The game itself updates automatically from the website.
      - name: Save log on failure
        if: failure()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-log; git rm -rfq . ; cp /dev/null x || true
          tail -300 build.log > log.txt || echo "no log" > log.txt
          git add log.txt; git commit -qm "build log"; git push -f origin ci-log
